name: Apple Silicon auto-reply

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  reply:
    runs-on: ubuntu-latest
    # Ignore bots (including this workflow's own comments)
    if: github.event.sender.type != 'Bot'
    steps:
      - name: Check for Apple Silicon questions and reply
        uses: actions/github-script@v7
        with:
          script: |
            const MARKER = '<!-- apple-silicon-auto-reply -->';
            const LABEL = 'apple-silicon';

            const issue = context.payload.issue;
            const isComment = context.eventName === 'issue_comment';

            // Never on pull requests (issue_comment also fires for PR comments)
            if (issue.pull_request) {
              core.info('Pull request - skipping.');
              return;
            }

            // Never react to maintainers: they discuss Apple Silicon in other contexts
            // (e.g. quoting a typosquat site), they don't ask whether it's supported.
            const MAINTAINER = ['OWNER', 'MEMBER', 'COLLABORATOR'];
            const association = isComment
              ? context.payload.comment.author_association
              : issue.author_association;
            if (MAINTAINER.includes(association)) {
              core.info(`Author is ${association} - skipping.`);
              return;
            }

            // In comments, only the person who opened the issue counts. Other
            // participants mentioning Apple Silicon don't change what the issue is about.
            if (isComment && context.payload.comment.user.login !== issue.user.login) {
              core.info('Comment is not from the issue author - skipping.');
              return;
            }

            // Issues that are clearly about something else
            const SKIP_LABELS = ['bot-ignore', 'typosquat'];
            const labels = (issue.labels || []).map(l => l.name);
            if (labels.some(l => SKIP_LABELS.includes(l))) {
              core.info(`Issue has a skip label (${labels.join(', ')}) - skipping.`);
              return;
            }

            const text = isComment
              ? context.payload.comment.body || ''
              : `${issue.title}\n${issue.body || ''}`;

            // Apple Silicon indicators
            const appleSilicon = /\b(apple\s*silicon|arm64|aarch64|M[1-9](\s*(pro|max|ultra))?)\b/i;
            // OpenCore / OCLP indicators (branding: keep - what users write)
            const openCore = /\b(open\s*core|oclp|opencore\s*legacy\s*patcher|hackintosh)\b/i;

            if (!appleSilicon.test(text) || !openCore.test(text)) {
              core.info('No Apple Silicon + OpenCore mention found.');
              return;
            }

            const { owner, repo } = context.repo;
            const issue_number = issue.number;

            // Only reply once per issue
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            if (comments.some(c => c.body && c.body.includes(MARKER))) {
              core.info('Already replied on this issue.');
              return;
            }

            const body = [
              MARKER,
              '👋 Thanks for your question!',
              '',
              '**OpenCore only works on Intel Macs.** Apple Silicon Macs (M1, M2, M3, M4 and later) ' +
              'use a completely different boot chain (iBoot instead of UEFI), so OpenCore and ' +
              'BridgePatcher cannot boot or run on them.',
              '',
              'If you are on an Intel Mac and this reply was triggered by mistake, just let us know and we will reopen the discussion.',
            ].join('\n');

            await github.rest.issues.createComment({ owner, repo, issue_number, body });

            // Add a label (created automatically if it doesn't exist)
            try {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [LABEL] });
            } catch (e) {
              core.warning(`Could not add label: ${e.message}`);
            }

            // Close the issue as "not planned"
            if (issue.state === 'open') {
              await github.rest.issues.update({
                owner, repo, issue_number, state: 'closed', state_reason: 'not_planned',
              });
            }
