name: Typosquat site watch

on:
  schedule:
    - cron: "41 5 * * *"   # daily, 05:41 UTC: full scan
    - cron: "17 */3 * * *" # every 3 hours: only watched and copycat-repo sites (see QUICK_RUN)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report findings, don't open any issues"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  pages: read

concurrency:
  group: typosquat-sites
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan for lookalike websites
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
          SITE_URL: ""   # empty = detected from the repo's GitHub Pages settings
          # Names whose typo variants are checked as domains under each TLD
          # bridgepatcher: the project's current name (the others are its former names)
          KEYWORDS: "bridgepatcher bridge-patcher opencore-legacy-patcher-t2 oclp-t2 opencorelegacypatchert2 oclpt2"
          # Words lookalike download sites put around the name (getbridgepatcher.com, bridgepatcher-download.net)
          AFFIXES: "download get official app mac free install"
          # Hosting platforms where anyone can claim <name>.<platform>; checked directly because
          # wildcard certificates keep these addresses out of certificate-transparency logs
          PLATFORMS: "github.io gitlab.io netlify.app vercel.app pages.dev web.app firebaseapp.com onrender.com surge.sh glitch.me itch.io"
          TLDS: "com net org io app dev info site xyz top online shop pro co cc"
          # Substrings searched for in certificate-transparency logs (crt.sh)
          CT_KEYWORDS: "bridgepatcher bridge-patcher legacy-patcher-t2 legacypatchert2 oclp-t2 oclpt2"
          # Newly registered domains (WhoisDS daily lists): days to look back, and names to
          # match in them; a hit is filed even before the domain shows any content
          NRD_DAYS: "7"
          NRD_KEYWORDS: "bridgepatcher opencore-legacy-patcher-t2 oclp-t2 legacy-patcher-t2"
          # A site only counts if its page mentions one of these (case-insensitive, | separated)
          CONTENT_MARKERS: "bridgepatcher|opencore legacy patcher t2|opencore-legacy-patcher-t2|oclp-t2|oclp t2"
          # Hosts (and their subdomains) that are never flagged
          ALLOWLIST: "github.com githubusercontent.com dortania.github.io bridgepatcher.github.io"
          # Former names of this project: a working website with one in its address (including
          # <name>.github.io) counts as a lookalike even if its page doesn't mention the project
          FORMER_NAMES: "OpenCore-Legacy-Patcher-T2 OCLP-T2"
          # Former official addresses: always reported as typosquats, online or not
          FORMER_HOSTS: "oclp-t2.github.io"
          # Known impersonation sites, full address with path (space separated). Checked on every
          # run, online or not; an issue is opened as soon as one serves a page.
          # tea-ching.github.io/OpenCore-Legacy-Patcher-T2: Pages site of the copycat repo
          # TEA-ching/OpenCore-Legacy-Patcher-T2 (its homepage link), down as of 2026-11-13
          KNOWN_SITES: "https://tea-ching.github.io/OpenCore-Legacy-Patcher-T2/"
          # Copycat repositories: repos found with these GitHub searches (| separated), plus direct
          # forks of this repo, have their homepage link and GitHub Pages site watched like
          # KNOWN_SITES. A repo's own Pages site counts as soon as it serves a page; any other
          # homepage only if it names the project (CONTENT_MARKERS).
          REPO_QUERIES: >-
            BridgePatcher in:name,description,readme fork:true|
            "OpenCore Legacy Patcher T2" in:name,description,readme fork:true|
            "OpenCore-Legacy-Patcher-T2" in:name,description,readme fork:true|
            "OCLP-T2" in:name,description,readme fork:true|
            "OCLP T2" in:name,description,readme fork:true
          CHECK_FORKS: "true"
          # Repos (owner/name) whose websites are never checked, e.g. a trusted contributor's fork
          ALLOWLIST_REPOS: ""
          # Misattributing articles: news and blog posts (e.g. en.soydemac.com) that present this
          # fork's T2 support as news about Dortania's OpenCore Legacy Patcher, without naming
          # BridgePatcher or saying it's an unofficial fork. Searched in Bing News and Google News
          # (no key needed) and, with BRAVE_SEARCH_API_KEY, the web. Daily runs only.
          NEWS_QUERIES: >-
            "OpenCore Legacy Patcher" T2|
            OCLP T2 Mac|
            "OpenCore Legacy Patcher" Tahoe T2|
            "OpenCore Legacy Patcher" Sequoia T2
          # News editions searched (language-COUNTRY); machine-translated sites show up in several
          NEWS_MARKETS: "en-US es-ES de-DE fr-FR it-IT pt-BR"
          # The 3-hourly runs check only FORMER_HOSTS, KNOWN_SITES and copycat repositories'
          # websites (no lookalike domains, crt.sh, WHOIS lists or web search)
          QUICK_RUN: ${{ github.event.schedule == '17 */3 * * *' && 'true' || 'false' }}
          # --- Content farms (any domain), found through the Brave Search API ---
          # Free key from https://api-dashboard.search.brave.com, stored as repo secret
          # BRAVE_SEARCH_API_KEY. Without it this part is skipped.
          # (BRAVE_API_KEY, the impersonation watch's name for the same key, works too)
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY || secrets.BRAVE_API_KEY }}
          # Search queries (| separated); each costs one request per run
          SEARCH_QUERIES: "\"BridgePatcher\" download|\"BridgePatcher\" macOS T2|\"OpenCore Legacy Patcher T2\" download|\"OCLP-T2\"|\"OpenCore-Legacy-Patcher-T2\"|OCLP T2 Tahoe T2 Mac download"
          SEARCH_RESULTS: "20"
          # Forums, news, video and code sites that are never treated as content farms
          FARM_ALLOWLIST: "bridgepatcher.github.io reddit.com youtube.com youtu.be x.com twitter.com insanelymac.com tonymacx86.com macrumors.com forums.macrumors.com stackexchange.com stackoverflow.com apple.com wikipedia.org discord.com discord.gg gitlab.com"
        run: python .github/scripts/typosquat_sites.py
