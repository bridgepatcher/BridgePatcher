name: Upstream typosquat watch

# Looks for websites and GitHub repositories imitating Dortania's OpenCore Legacy
# Patcher and keeps one pinned warning issue in THIS repo up to date, so users
# know what to avoid. Nobody else is contacted. Close the issue to pause.

on:
  schedule:
    # Twice a day: GitHub delays scheduled runs by hours under load and sometimes
    # drops them, so a single daily slot can leave the list stale for two days.
    - cron: "29 7 * * *"    # 07:29 UTC
    - cron: "29 19 * * *"   # 19:29 UTC
  # Refresh right away when the scan settings or scripts change, instead of
  # waiting for the next scheduled slot
  push:
    branches: [main]
    paths:
      - .github/workflows/upstream-typosquat-watch.yml
      - .github/scripts/upstream_typosquat_watch.py
      - .github/scripts/typosquat_sites.py
      - .github/scripts/typosquat_watch.py
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report findings in the run summary, don't touch the issue"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-typosquat-watch
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan for lookalikes of Dortania's OpenCore Legacy Patcher
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPO: dortania/OpenCore-Legacy-Patcher
          ISSUE_REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
          PROJECT_NAME: "OpenCore Legacy Patcher"
          # Mentioned once, in a comment when the warning issue is first created
          MENTIONS: "khronokernel dhinakg albert-steinhof gandolf243 IronApple0915"
          # --- GitHub repositories ---
          # Repo names whose lookalikes (and non-fork copies) are checked
          # OpenCore-Legacy-Patcher-T2 (this project's former name) imitates Dortania's too
          REPO_NAMES: "OpenCore-Legacy-Patcher OpenCore-Legacy-Patcher-T2"
          # Owners / repos (owner/name) that are never listed
          ALLOWLIST_OWNERS: "bridgepatcher albert-steinhof"
          ALLOWLIST_REPOS: ""
          # Former names of this project: repos that still use one in their name are listed
          # too, whether they're GitHub forks (of upstream or of this project) or not
          FORMER_NAMES: "OpenCore-Legacy-Patcher-T2 OCLP-T2"
          # Former official addresses: listed as typosquats whenever something is published there
          # albert-mueller.github.io: the account was renamed and its name is free to register; search
          # engines still list the address as "OpenCore Legacy Patcher"
          FORMER_HOSTS: "oclp-t2.github.io albert-mueller.github.io"
          # Spam repositories named after the abbreviation (oclp, oclpu, oclpy, ...) and filled with
          # gambling ads: listed when at least SPAM_MIN_FILES top-level file names contain one of
          # SPAM_TERMS (| separated). Only specific Chinese gambling terms, so an honest repo that
          # merely mentions a lottery (e.g. an Oregon Lottery presentation) never matches.
          SPAM_NAMES: "oclp"
          SPAM_TERMS: "彩票|购彩|博彩|时时彩|六合彩|快3|快三|竞彩|体彩|百家乐|棋牌|牛牛|飞艇|大小单双|倍投|下注|赌场|娱乐城"
          SPAM_MIN_FILES: "10"
          # --- Other sites to avoid (checked by hand) ---
          # Sites that don't imitate the name but mislead visitors about the project or serve
          # malicious ads. One per line: host | what was found | where it's documented
          OTHER_SITES: |
            en.soydemac.com | Machine-written article that falsely claims Dortania's OpenCore Legacy Patcher now supports T2 Macs; its ads led to a fake payment page, a fake Steam login (phishing), notification spam and a browser hijacker | bridgepatcher/BridgePatcher#599
          # --- Misleading articles and risky-ad sites (found automatically) ---
          # News and blog posts, often machine-translated editions like en.soydemac.com, that present
          # an unofficial fork's T2 support as news about OpenCore Legacy Patcher, or that write about
          # it on pages loading malvertising-prone ad networks, or that claim it supports things it
          # doesn't (macOS 27, Apple silicon Macs; see FALSE_CLAIMS in typosquat_sites.py). Listed under
          # "Other sites to avoid", one entry per site with all its language editions. Searched in
          # Bing News and Google News (no key needed) and, with the Brave key, the web.
          # The general queries find articles on sites with risky ads (pop-under / push ad networks
          # that malicious ads come through), listed whatever they claim, like en.soydemac.com's.
          NEWS_QUERIES: >-
            "OpenCore Legacy Patcher" T2|
            OCLP T2 Mac|
            "OpenCore Legacy Patcher" Tahoe T2|
            "OpenCore Legacy Patcher" Sequoia T2|
            "OpenCore Legacy Patcher"|
            "OpenCore Legacy Patcher" download|
            OCLP unsupported Mac macOS|
            "OpenCore Legacy Patcher" "macOS 27"|
            "OpenCore Legacy Patcher" Golden Gate|
            "OpenCore Legacy Patcher" "Apple Silicon"|
            "OpenCore Legacy Patcher" M1
          NEWS_MARKETS: "en-US es-ES de-DE fr-FR it-IT pt-BR"
          # Always searched through their own (WordPress) search, even when no news feed lists them
          NEWS_SITES: "soydemac.com en.soydemac.com"
          # --- Websites of listed repositories ---
          # The homepage link and GitHub Pages site of every listed repository is checked, and listed
          # while it serves a page, including one hidden behind a fake 404 (the owner's own "not
          # found" page). Known ones are checked even if their repository disappears (full address).
          KNOWN_SITES: "https://tea-ching.github.io/OpenCore-Legacy-Patcher-T2/"
          # --- Websites ---
          # Names whose typo variants are checked as domains under each TLD
          KEYWORDS: "opencore-legacy-patcher opencorelegacypatcher oclp opencore-patcher opencore-legacy-patcher-t2 oclp-t2"
          TLDS: "com net org io app dev info site xyz top online shop pro co cc"
          # Substrings searched for in certificate-transparency logs (crt.sh)
          # (legacyopencore / opencorepatcher: the same words in another order, e.g. legacyopencorepatcher.com)
          CT_KEYWORDS: "opencore-legacy-patcher opencorelegacypatcher legacy-patcher legacypatcher legacyopencore legacy-opencore opencorepatcher"
          # Words lookalike download sites put around the name (getoclp.com, opencorelegacypatcher-download.net)
          AFFIXES: "download get official app mac free install"
          # Hosting platforms where anyone can claim <name>.<platform>; checked directly because
          # wildcard certificates keep these addresses out of certificate-transparency logs
          PLATFORMS: "github.io gitlab.io netlify.app vercel.app pages.dev web.app firebaseapp.com onrender.com surge.sh glitch.me itch.io"
          # Newly registered domains: days to look back, names to match, and how long
          # an empty one keeps being re-checked before it's dropped
          NRD_DAYS: "7"
          NRD_KEYWORDS: "opencorelegacypatcher legacypatcher legacyopencorepatcher opencorepatcher"
          WATCH_DAYS: "60"
          # A site is only listed if its page mentions one of these (case-insensitive, | separated)
          CONTENT_MARKERS: "opencore legacy patcher|opencore-legacy-patcher|opencorelegacypatcher"
          # Hosts (and their subdomains) that are never listed
          # oclp.net: possibly a Chinese community site, not verified as a fake
          ALLOWLIST: "github.com githubusercontent.com dortania.github.io bridgepatcher.github.io oclp.net"
          # --- Web search (optional) ---
          # With a free Brave Search API key (https://api-dashboard.search.brave.com) stored as repo
          # secret BRAVE_SEARCH_API_KEY (or BRAVE_API_KEY), search results are checked too. Only pages
          # on hosting platforms (someone.itch.io/...) or with the project's name in their address are
          # considered, and only if they offer downloads; news sites and blogs never are.
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY || secrets.BRAVE_API_KEY }}
          SEARCH_QUERIES: "\"OpenCore Legacy Patcher\" download|\"OpenCore Legacy Patcher\" download pkg Tahoe|\"OpenCore-Patcher.pkg\" download|OCLP download unsupported Mac"
          SEARCH_RESULTS: "20"
          FARM_ALLOWLIST: "reddit.com youtube.com youtu.be x.com twitter.com insanelymac.com tonymacx86.com macrumors.com stackexchange.com stackoverflow.com apple.com wikipedia.org discord.com discord.gg gitlab.com sourceforge.net"
          # Entries not seen for this many days are removed from the list
          FORGET_DAYS: "365"
          # Entries taken down (🔴) this many days in a row are removed from the list
          TAKEDOWN_DAYS: "2"
          OFFICIAL_SOURCES: |
            - **OpenCore Legacy Patcher** by Dortania: https://github.com/dortania/OpenCore-Legacy-Patcher and https://dortania.github.io/OpenCore-Legacy-Patcher/
            - **BridgePatcher** (formerly OpenCore Legacy Patcher T2, not affiliated with Dortania): https://github.com/bridgepatcher/BridgePatcher and https://bridgepatcher.github.io/ . Anything else still called "OpenCore Legacy Patcher T2" or "OCLP-T2" is not official.
        run: python .github/scripts/upstream_typosquat_watch.py
