name: Comment boot panic check result

# Posts the result of "Check EFI builds for boot panics" on the PR.
#
# The check itself runs on `pull_request` with a read-only token because it
# executes the PR's patcher code. This workflow runs afterwards via
# workflow_run, from the default branch, with permission to comment - and it
# never checks out or runs anything from the PR. The artifact it reads was
# produced by PR code, so everything in it is treated as untrusted data:
# the PR is looked up through the API (not taken from the artifact), and every
# string is escaped before it goes into the comment.
#
# Like the tracking issue on main, the comment lists every problem that can
# stop a root-patched Mac from booting with the PR's code - the PR's new ones
# and the ones already on main - plus what the PR fixes and a check that
# couldn't run. Only new problems fail the check. A PR with nothing to report
# gets no comment (an earlier one is updated to ✅).

on:
  workflow_run:
    workflows: ["Check EFI builds for boot panics"]
    types: [completed]

permissions: {}

jobs:
  comment:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled' &&
      github.event.workflow_run.conclusion != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: boot-panic-result
          path: ${{ runner.temp }}/result
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Comment on the PR
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const MARKER = '<!-- boot-panic-bot -->';
            const MAX = 40;
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            const headSha = run.head_sha, short = headSha.slice(0, 7);
            const dir = `${process.env.RUNNER_TEMP}/result`;

            // --- Find the PR through the API, never from the artifact ---
            // run.pull_requests can also list PRs from *other* repos (forks, the
            // pre-move repo) that share this head SHA - their numbers 404 here.
            const repoId = context.payload.repository.id;
            let number = null;
            for (const p of run.pull_requests || []) {
              if (p.base && p.base.repo && p.base.repo.id === repoId &&
                  p.head && p.head.sha === headSha) number = p.number;
            }
            if (!number && run.head_repository) {
              const pulls = await github.paginate(github.rest.pulls.list, {
                owner, repo, state: 'open', per_page: 100,
                head: `${run.head_repository.owner.login}:${run.head_branch}` });
              const match = pulls.find(p => p.head.sha === headSha);
              if (match) number = match.number;
            }
            if (!number) { core.info(`No open PR at ${headSha} - nothing to comment on`); return; }
            let pr;
            try {
              ({ data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number }));
            } catch (e) {
              if (e.status === 404) { core.info(`#${number} is not a PR in ${owner}/${repo} - nothing to comment on`); return; }
              throw e;
            }
            if (pr.state !== 'open' || pr.head.sha !== headSha) {
              core.info(`PR #${number} has moved on from ${short} - the newer run will comment`);
              return;
            }

            // --- Read the result (untrusted data) ---
            if (fs.existsSync(`${dir}/skipped`)) return;
            let result = null;
            try { result = JSON.parse(fs.readFileSync(`${dir}/result.json`, 'utf8')); } catch {}
            if (!result && run.conclusion === 'success') return;   // nothing ran, nothing to say

            const arr = v => Array.isArray(v) ? v : [];
            const fatal = !result ? 'no result was produced' : (result.fatal ? String(result.fatal) : null);
            const problems = result ? arr(result.new) : [];
            const known = result ? arr(result.known) : [];
            const errors = result ? arr(result.errors) : [];
            const fixed = result ? arr(result.fixed) : [];
            const esc = s => String(s ?? '').replace(/[|`<>\[\]\\]/g, c => '&#' + c.charCodeAt(0) + ';')
                                            .replace(/@/g, '@\u200b').replace(/\s+/g, ' ').slice(0, 400);
            const rows = list => `| Case | Where | Problem |\n|---|---|---|\n` +
              list.slice(0, MAX).map(p => `| <code>${esc(p.case)}</code> | <code>${esc(p.subject)}</code> | ${esc(p.message)} |`).join('\n') +
              (list.length > MAX ? `\n\n…and ${list.length - MAX} more - see the [workflow run](${run.html_url}).` : '');

            const errorSection = errors.length
              ? `\n\n<details><summary>${errors.length} scenario(s) couldn't be checked</summary>\n\n` +
                `The EFI builder or the root-patch gate failed for these, so they weren't checked at all.\n\n| Case | Where | Error |\n|---|---|---|\n` +
                errors.slice(0, MAX).map(e => `| <code>${esc(e.case)}</code> | <code>${esc(e.subject)}</code> | ${esc(e.message)} |`).join('\n') +
                `\n</details>`
              : '';

            // Only our own comments - anybody can paste the marker into a comment
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number, per_page: 100 });
            const existing = comments.find(c => c.body && c.body.includes(MARKER) && c.user && c.user.type === 'Bot' && c.user.login === 'github-actions[bot]');

            // Like the tracking issue on main: every problem that can stop a
            // root-patched Mac from booting with this PR's code is listed - new
            // ones and the ones that are already on main. Only new ones fail the check.
            const total = problems.length + known.length;
            if (!fatal && !total && !fixed.length && !existing) return;   // nothing to report, never commented

            let headline, intro, introDe;
            if (fatal) {
              headline = `### ⚠️ The boot panic check could not run`;
              intro = `The check couldn't build EFIs or run the root-patch gate from this PR (at ${short}), so it can't tell whether a root-patched Mac would still boot:\n\n> ${esc(fatal)}\n\n` +
                `This usually means the PR breaks \`efi_builder\`, \`support/defaults.py\`, \`detect.py\`, a patchset or an import they need - or PatcherSupportPkg couldn't be fetched. See the [workflow run](${run.html_url}) for the log.`;
              introDe = `Der Check konnte aus diesem PR (bei ${short}) keine EFIs bauen bzw. die Root-Patch-Prüfung nicht ausführen und kann daher nicht sagen, ob ein root-gepatchter Mac noch startet. ` +
                `Meist bricht der PR \`efi_builder\`, \`support/defaults.py\`, \`detect.py\`, ein Patchset oder einen benötigten Import - oder PatcherSupportPkg konnte nicht geladen werden. Details im Workflow-Log.`;
            } else if (problems.length) {
              headline = `### 🛑 This PR adds ${problems.length} way(s) to stop root-patched Macs from booting`;
              intro = `With this PR (at ${short}), ${total} problem(s) can end in a kernel panic or a Mac that never reaches the desktop. ` +
                `**${problems.length} of them are new in this PR** and fail this check` + (known.length ? `; ${known.length} are already on \`main\`.` : '.');
              introDe = `Mit diesem PR (bei ${short}) können ${total} Probleme in einer Kernel Panic oder einem Mac enden, der nie den Schreibtisch erreicht. ` +
                `**${problems.length} davon führt dieser PR neu ein** (der Check schlägt fehl)` + (known.length ? `, ${known.length} bestehen schon auf \`main\`.` : '.');
            } else if (known.length) {
              headline = `### ⚠️ ${known.length} problem(s) can still stop root-patched Macs from booting`;
              intro = `With this PR (at ${short}), these problems that are already on \`main\` can still end in a kernel panic or a Mac that never reaches the desktop. ` +
                `This PR doesn't add any, so the check passes - but they are just as dangerous, and fixing them here is welcome.` +
                (fixed.length ? ` It does fix ${fixed.length} other one(s) 🎉.` : '');
              introDe = `Mit diesem PR (bei ${short}) können diese Probleme, die schon auf \`main\` bestehen, weiterhin in einer Kernel Panic oder einem Mac enden, der nie den Schreibtisch erreicht. ` +
                `Der PR führt keine neuen ein, daher besteht der Check - gefährlich sind sie trotzdem.` + (fixed.length ? ` ${fixed.length} andere behebt er 🎉.` : '');
            } else if (fixed.length) {
              headline = `### 🎉 This PR fixes ${fixed.length} boot panic problem(s) on \`main\``;
              intro = `With this PR (at ${short}), no checked EFI build or root patch can stop a root-patched Mac from booting: it fixes ${fixed.length} problem(s) that are on \`main\` and adds none. ` +
                `Once it's merged, the tracking issue on \`main\` updates (or closes) on its own.`;
              introDe = `Mit diesem PR (bei ${short}) kann kein geprüfter EFI-Build und kein Root-Patch einen root-gepatchten Mac mehr am Starten hindern: er behebt ${fixed.length} Probleme auf \`main\` und führt keine neuen ein.`;
            } else {
              headline = `### ✅ Boot panic check OK`;
              intro = `No checked EFI build or root patch from this PR can stop a root-patched Mac from booting (checked at ${short}). Thanks!`;
              introDe = `Kein geprüfter EFI-Build und kein Root-Patch aus diesem PR kann einen root-gepatchten Mac am Starten hindern (geprüft bei ${short}). Danke!`;
            }

            let body = `${MARKER}\n${headline}\n\n${intro}`;
            if (problems.length) body += `\n\n#### 🛑 New in this PR (${problems.length})\n\n${rows(problems)}`;
            if (known.length) body += `\n\n#### ⚠️ Already on \`main\` (${known.length})\n\n${rows(known)}`;
            if (total) {
              body += `\n\n**What the cases mean:**\n` +
                `- \`build:host\` / \`gate:amfipass\`: AMFIPass only trusts binaries signed by Dortania's CA, and BridgePatcher's root patches aren't. ` +
                `Wherever the patches need AMFI disabled, the EFI built on that Mac must carry \`amfi=0x80\`, and detect.py must not let patching run just because AMFIPass is loaded - ` +
                `otherwise AMFI rejects the patched frameworks ("code signature validation failed"), as in #788.\n` +
                `- \`efi:kernel-patches\`: a kernel patch OpenCore would reject or apply to the wrong bytes - corrupted kernel code panics at boot.\n` +
                `- \`efi:kexts\`: a kext missing from the EFI, injected twice for the same macOS, or injected before a kext it depends on (OpenCore links them in \`Kernel > Add\` order).\n` +
                `- \`payload:root-patches\`: a root patch file the patchsets install that is missing from the bundled PatcherSupportPkg release (patching stops at the preflight check), ` +
                `a Mach-O without x86_64 code, or a kext kmutil can't link.`;
            }
            if (fixed.length) body += `\n\n<details><summary>🎉 Fixed by this PR - ${fixed.length} problem(s) that are on <code>main</code></summary>\n\n${rows(fixed)}\n</details>`;
            body += errorSection;
            body += `\n\n<details><summary>Deutsch</summary>\n\n${introDe}` +
              (total ? `\n\n- \`build:host\` / \`gate:amfipass\`: AMFIPass vertraut nur von Dortania signierten Binärdateien, BridgePatchers Root-Patches sind das nicht. ` +
                `Wo die Patches AMFI deaktiviert brauchen, muss das EFI \`amfi=0x80\` enthalten, und detect.py darf das Patchen nicht nur wegen AMFIPass zulassen (#788).\n` +
                `- \`efi:kernel-patches\`: ein Kernel-Patch, den OpenCore ablehnt oder an die falschen Bytes schreibt.\n` +
                `- \`efi:kexts\`: ein Kext fehlt im EFI, wird doppelt oder vor einer Abhängigkeit geladen.\n` +
                `- \`payload:root-patches\`: eine Root-Patch-Datei fehlt im mitgelieferten PatcherSupportPkg, hat keinen x86_64-Code, oder ein Kext lässt sich von kmutil nicht linken.` : '') +
              `\n\nDieser Kommentar aktualisiert sich bei jedem Push automatisch.\n</details>`;
            body += `\n\n<sub>Updates automatically on every push.</sub>`;

            if (body.length > 65000) body = body.slice(0, 64000) + `\n\n…truncated - see the [workflow run](${run.html_url}).`;
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
