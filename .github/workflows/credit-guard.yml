# .github/workflows/credit-guard.yml
#
# Makes sure contributors are credited in README.md ("## Credits").
#   - PR whose author/commit authors are not in Credits:
#       comment + label "needs-credit" (the PR is NOT closed)
#   - Such a PR gets merged and they are still not credited:
#       an issue is opened as a reminder
#   - PR or push that removes someone from Credits:
#       PR gets a warning comment, a push opens an issue (nothing is closed)
#   - Intended removals (contribution reverted/replaced, or at the contributor's request)
#       are listed in .github/retired-credits.txt and not reported.
#   - Bots and AI coding agents (e.g. commits by Claude Code or Cursor's agent, GitHub Apps
#       such as the Copilot coding agent) are never asked to be credited.
#   - Audit of main (job "audit": pushes, daily schedule, manual runs): walks every commit on
#       main that changed README.md and reports anyone who was credited at some point and has
#       been removed since without an entry in .github/retired-credits.txt. This doesn't trust
#       main as it is now: a removal that already landed (issue closed, guard bypassed or
#       failing at the time) is still found. ONE issue is kept up to date and closed once fixed.
# Pull request code is only read through the API, never checked out or executed. The audit
# checks out main (never a pull request) and only reads its history with git.
#
# Limits: a push runs the workflow file from the pushed commit, and a force-push can rewrite
# main's history (the Attribution guard reports force-pushes). Protect main with a ruleset
# (require pull requests, block force pushes, CODEOWNERS review for .github/).

name: Credit guard

on:
  pull_request_target:
    types: [opened, reopened, synchronize, closed]
  push:
    branches: [main]
    paths: [README.md, .github/retired-credits.txt]
  schedule:
    - cron: "41 3 * * *"   # daily audit of main
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  credits:
    if: github.event_name == 'pull_request_target' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check contributor credits
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const README = 'README.md';
            const LABEL = 'needs-credit';
            const MARK_MISSING = '<!-- credit-guard-missing -->';
            const MARK_REMOVED = '<!-- credit-guard-removed -->';
            // Never asked to be credited
            const IGNORE = new Set([owner.toLowerCase(), 'github-actions[bot]', 'dependabot[bot]', 'web-flow']);

            async function readFile(o, r, ref) {
              try {
                const { data } = await github.rest.repos.getContent({ owner: o, repo: r, path: README, ref });
                return Buffer.from(data.content, 'base64').toString('utf8');
              } catch (e) { if (e.status === 404) return ''; throw e; }
            }

            // Text of the "## Credits" section only
            function creditsSection(md) {
              const m = md.match(/^#{1,3}\s*credits\b.*$/im);
              if (!m) return '';
              const rest = md.slice(m.index + m[0].length);
              const next = rest.search(/^#{1,2}\s+\S/m); // stop at the next ## heading
              return next === -1 ? rest : rest.slice(0, next);
            }

            // GitHub logins linked or @-mentioned in the Credits section
            function creditedLogins(section) {
              const set = new Set();
              for (const m of section.matchAll(/github\.com\/([A-Za-z0-9-]+)/g)) set.add(m[1].toLowerCase());
              for (const m of section.matchAll(/@([A-Za-z0-9-]+)/g)) set.add(m[1].toLowerCase());
              return set;
            }

            // Credits removed on purpose (e.g. the contribution was reverted). Read from trusted refs only
            // (PR base / commit before the push), plus - in a fork - the original repo's default branch,
            // so a fork syncing an intended removal from upstream isn't reported. Add the entry first,
            // then remove the credit.
            const RETIRED_FILE = '.github/retired-credits.txt';
            async function loadRetired(ref) {
              const set = new Set();
              const sources = [{ o: owner, r: repo, ref }];
              try {
                const { data } = await github.rest.repos.get({ owner, repo });
                const src = data.fork && (data.source || data.parent);
                if (src) sources.push({ o: src.owner.login, r: src.name, ref: src.default_branch });
              } catch (e) { core.warning(`Could not read repository info: ${e.message}`); }
              for (const s of sources) {
                try {
                  const { data } = await github.rest.repos.getContent({ owner: s.o, repo: s.r, path: RETIRED_FILE, ref: s.ref });
                  for (const raw of Buffer.from(data.content, 'base64').toString('utf8').split('\n')) {
                    const login = raw.split('#')[0].trim().replace(/^@/, '').toLowerCase();
                    if (login) set.add(login);
                  }
                } catch (e) { if (e.status !== 404) core.warning(`Could not read ${s.o}/${s.r}:${RETIRED_FILE}: ${e.message}`); }
              }
              return set;
            }

            const isCredited = (login, set) => set.has(login.toLowerCase());
            const relevant = l => l && !IGNORE.has(l.toLowerCase()) && !l.endsWith('[bot]');

            // AI coding agents are not contributors to credit. Matched on the commit's author
            // email, not the login: agents commit under their vendor's no-reply address, which
            // GitHub links to whatever account registered it (noreply@anthropic.com resolves
            // to the unrelated user @claude) - while a real person who happens to use such a
            // login still commits under their own address and is still credited. Agents that
            // run as GitHub Apps (Copilot coding agent, Devin, ...) are accounts of type "Bot".
            const AI_AGENT_EMAILS = new Set([
              'noreply@anthropic.com',   // Claude Code
              'cursoragent@cursor.com',  // Cursor background agent
            ]);
            const isBotAccount = user => !!user && user.type === 'Bot';
            const isAiAgentCommit = c =>
              isBotAccount(c.author) ||
              AI_AGENT_EMAILS.has(((c.commit && c.commit.author && c.commit.author.email) || '').toLowerCase());

            async function prContributors(pr) {
              const people = new Set();
              if (!isBotAccount(pr.user)) people.add(pr.user.login);
              const commits = await github.paginate(github.rest.pulls.listCommits, {
                owner, repo, pull_number: pr.number, per_page: 100,
              });
              for (const c of commits) {
                if (!c.author || !c.author.login) continue;
                if (isAiAgentCommit(c)) {
                  core.info(`Not asking for credit: commit ${c.sha.slice(0, 7)} is by an AI agent (${c.commit.author.email}, @${c.author.login})`);
                  continue;
                }
                people.add(c.author.login);
              }
              return [...people].filter(relevant);
            }

            async function upsertComment(issue_number, marker, body) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number, per_page: 100,
              });
              const existing = comments.find(c => (c.body || '').includes(marker));
              if (!body) {
                if (existing) await github.rest.issues.deleteComment({ owner, repo, comment_id: existing.id });
                return;
              }
              if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              else await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

            async function openIssueOnce(title, body) {
              const open = await github.paginate(github.rest.issues.listForRepo, {
                owner, repo, state: 'open', labels: LABEL, per_page: 100,
              });
              if (open.some(i => i.title === title)) return;
              await github.rest.issues.create({ owner, repo, title, body, labels: [LABEL] });
            }

            const list = arr => arr.map(l => `- @${l}`).join('\n');

            // ---------- Pull requests ----------
            if (context.eventName === 'pull_request_target') {
              const pr = context.payload.pull_request;
              const action = context.payload.action;
              const headOwner = pr.head.repo ? pr.head.repo.owner.login : owner;
              const headRepo  = pr.head.repo ? pr.head.repo.name : repo;

              // Compare against the merge base, so a PR made from an older main
              // isn't blamed for credits that were added to main afterwards
              const { data: cmp } = await github.rest.repos.compareCommitsWithBasehead({
                owner, repo, basehead: `${pr.base.sha}...${pr.head.sha}`,
              });
              const mergeBase = cmp.merge_base_commit.sha;
              const baseCredits = creditedLogins(creditsSection(await readFile(owner, repo, mergeBase)));
              const headCredits = creditedLogins(creditsSection(await readFile(headOwner, headRepo, pr.head.sha)));
              const people = await prContributors(pr);

              // Merged: remind if someone is still not credited on the target branch
              if (action === 'closed') {
                if (!pr.merged) return;
                const nowCredits = creditedLogins(creditsSection(await readFile(owner, repo, pr.base.ref)));
                const missing = people.filter(l => !isCredited(l, nowCredits));
                if (!missing.length) return;
                await openIssueOnce(`Credit missing for PR #${pr.number}`, [
                  MARK_MISSING,
                  `PR #${pr.number} (**${pr.title}**) was merged, but these contributors are not listed in the **Credits** section of \`${README}\`:`,
                  '',
                  list(missing),
                  '',
                  `Please add them with a short description of what they contributed, e.g.:`,
                  '```md',
                  ...missing.map(l => `* [${l}](https://github.com/${l})\n    * <what they did> (#${pr.number})`),
                  '```',
                ].join('\n'));
                return;
              }

              // Someone credited at the merge base would be removed by this PR
              const retired = await loadRetired(pr.base.sha);
              const removed = [...baseCredits].filter(l => !headCredits.has(l) && relevant(l) && !retired.has(l));
              await upsertComment(pr.number, MARK_REMOVED, removed.length ? [
                MARK_REMOVED,
                '> [!WARNING]',
                '> **This pull request removes existing contributors from the Credits section.**',
                '',
                list(removed),
                '',
                'Credits for past contributions must stay in the README. Please restore these entries, or explain here why they should be changed.',
              ].join('\n') : null);

              // Author / commit authors not credited (counting credits added in this PR)
              const missing = people.filter(l => !isCredited(l, baseCredits) && !isCredited(l, headCredits));
              await upsertComment(pr.number, MARK_MISSING, missing.length ? [
                MARK_MISSING,
                '> [!NOTE]',
                '> **Thanks for contributing! The following contributors are not yet listed in the Credits section of `README.md`:**',
                '',
                list(missing),
                '',
                'You can add yourself in this pull request, for example:',
                '```md',
                ...missing.map(l => `* [${l}](https://github.com/${l})\n    * <what you contributed>`),
                '```',
                'Otherwise a maintainer will add you when merging. This is only a reminder, the pull request stays open.',
              ].join('\n') : null);

              try {
                if (missing.length) {
                  await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: [LABEL] });
                } else {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name: LABEL });
                }
              } catch (e) { if (e.status !== 404) core.warning(`Label update failed: ${e.message}`); }
              return;
            }

            // ---------- Pushes to main: someone removed from Credits ----------
            const { before, after } = context.payload;
            if (/^0+$/.test(before) || /^0+$/.test(after)) return;
            const oldCredits = creditedLogins(creditsSection(await readFile(owner, repo, before)));
            const newCredits = creditedLogins(creditsSection(await readFile(owner, repo, after)));
            const retired = await loadRetired(before);
            const removed = [...oldCredits].filter(l => !newCredits.has(l) && relevant(l) && !retired.has(l));
            if (!removed.length) return;

            await openIssueOnce(`Contributors removed from Credits (${after.slice(0, 7)})`, [
              MARK_REMOVED,
              '> [!WARNING]',
              `> **A push to \`main\` removed contributors from the Credits section of \`${README}\`.**`,
              '',
              list(removed),
              '',
              `**Pushed by:** @${context.actor}`,
              `**Compare:** https://github.com/${owner}/${repo}/compare/${before.slice(0, 12)}...${after.slice(0, 12)}`,
              '',
              'Please restore these entries, or close this issue with a note if the removal was intended (e.g. at the contributor\'s request).',
            ].join('\n'));

  # Audit of main as a whole, from its history (see the header)
  audit:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    concurrency:
      group: credit-audit
      cancel-in-progress: false
    steps:
      # main only (the pushed commit, or the default branch on schedule / manual runs);
      # its files are read with git as data, nothing from it is executed
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Audit Credits history on main
        uses: actions/github-script@v7
        with:
          script: |
            const { execFileSync } = require('child_process');
            const { owner, repo } = context.repo;
            const README = 'README.md';
            const RETIRED_FILE = '.github/retired-credits.txt';
            const LABEL = 'needs-credit';
            const MARKER = '<!-- credit-guard-audit -->';
            const TITLE = 'Credit audit: contributors removed from Credits on main';
            const IGNORE = new Set([owner.toLowerCase(), 'github-actions[bot]', 'dependabot[bot]', 'web-flow']);
            const relevant = l => l && !IGNORE.has(l) && !l.endsWith('[bot]');

            // git output, or '' when the file doesn't exist at that commit
            const git = (...args) => {
              try { return execFileSync('git', args, { encoding: 'utf8', maxBuffer: 1 << 28, stdio: ['ignore', 'pipe', 'ignore'] }); }
              catch { return ''; }
            };

            // Same parsing as the "credits" job
            function creditsSection(md) {
              const m = md.match(/^#{1,3}\s*credits\b.*$/im);
              if (!m) return '';
              const rest = md.slice(m.index + m[0].length);
              const next = rest.search(/^#{1,2}\s+\S/m);
              return next === -1 ? rest : rest.slice(0, next);
            }
            function creditedLogins(section) {
              const set = new Set();
              for (const m of section.matchAll(/github\.com\/([A-Za-z0-9-]+)/g)) set.add(m[1].toLowerCase());
              for (const m of section.matchAll(/@([A-Za-z0-9-]+)/g)) set.add(m[1].toLowerCase());
              return set;
            }
            const creditsAt = sha => creditedLogins(creditsSection(git('show', `${sha}:${README}`)));
            const parseRetired = text => new Set(text.split('\n')
              .map(l => l.split('#')[0].trim().replace(/^@/, '').toLowerCase()).filter(Boolean));
            const retiredAt = sha => parseRetired(git('show', `${sha}:${RETIRED_FILE}`));

            // Exclusions: entries in the retired list as it is now, as it was when the credit was
            // removed (before or in that commit), and - in a fork - the original repo's list.
            const head = git('rev-parse', 'HEAD').trim();
            const retiredNow = retiredAt(head);
            try {
              const { data } = await github.rest.repos.get({ owner, repo });
              const src = data.fork && (data.source || data.parent);
              if (src) {
                const { data: f } = await github.rest.repos.getContent({ owner: src.owner.login, repo: src.name, path: RETIRED_FILE, ref: src.default_branch });
                for (const l of parseRetired(Buffer.from(f.content, 'base64').toString('utf8'))) retiredNow.add(l);
              }
            } catch (e) { if (e.status !== 404) core.warning(`Could not read the original repository's ${RETIRED_FILE}: ${e.message}`); }

            // Every commit on main's first-parent line that changed README.md, oldest first
            // (for a merged pull request that is the merge commit, diffed against main before it)
            const shas = git('rev-list', '--reverse', '--first-parent', 'HEAD', '--', README).split('\n').filter(Boolean);
            const gone = new Map(); // login -> commit that removed the credit
            for (const sha of shas) {
              const parent = git('rev-parse', '--verify', '--quiet', `${sha}^1`).trim();
              const after = creditsAt(sha);
              if (parent) {
                const before = creditsAt(parent);
                const excused = new Set([...retiredNow, ...retiredAt(parent), ...retiredAt(sha)]);
                for (const l of before) {
                  if (!after.has(l) && relevant(l) && !excused.has(l)) gone.set(l, sha);
                }
              }
              for (const l of after) gone.delete(l); // credited again
            }
            const now = creditsAt(head);
            const missing = [...gone].filter(([l]) => !now.has(l) && !retiredNow.has(l)).sort();
            core.info(`Checked ${shas.length} commits that changed ${README}; ${missing.length} contributor(s) missing.`);

            const open = (await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: LABEL, per_page: 100,
            })).filter(i => !i.pull_request && i.title === TITLE);

            if (!missing.length) {
              for (const i of open) {
                await github.rest.issues.createComment({ owner, repo, issue_number: i.number,
                  body: `${MARKER}\n✅ Everyone who was removed from the Credits is credited or retired again. Closing.` });
                await github.rest.issues.update({ owner, repo, issue_number: i.number, state: 'closed', state_reason: 'completed' });
              }
              return;
            }

            // Profile links instead of @mentions, so updating this issue doesn't ping anyone
            const rows = missing.map(([l, sha]) => {
              const subject = git('log', '-1', '--format=%cs %s', sha).trim();
              return `- [${l}](https://github.com/${l}) — removed in [\`${sha.slice(0, 7)}\`](https://github.com/${owner}/${repo}/commit/${sha}) (${subject})`;
            });
            const body = [
              MARKER,
              '> [!WARNING]',
              `> **These contributors were credited in \`${README}\` on main and have been removed since, without an entry in \`${RETIRED_FILE}\`.**`,
              '',
              ...rows,
              '',
              'This audit walks main\'s whole history, so it also finds removals that got past the checks on pull requests and pushes.',
              `Restore these credits, or add the contributor to \`${RETIRED_FILE}\` with the reason (contribution reverted or replaced, or at their own request).`,
              'This issue is updated on every push and every day, and closed automatically once nothing is missing.',
            ].join('\n');
            if (open.length) await github.rest.issues.update({ owner, repo, issue_number: open[0].number, body });
            else await github.rest.issues.create({ owner, repo, title: TITLE, body, labels: [LABEL] });
            core.setFailed(`Credit audit: ${missing.length} contributor(s) removed from Credits on main.`);
