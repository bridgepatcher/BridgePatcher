# .github/workflows/attribution-guard.yml
#
# Detects removal or rewriting of Dortania's copyright, licence and credit notices
# (e.g. "Copyright (c) 2020-2025 Dhinak G, Mykola Grymalyuk" -> "... Albert",
# dropped LICENSE lines, or Dortania authors removed from the README Credits).
#   - Pull request: the PR is closed immediately with a warning comment.
#   - Push to main: an issue is opened for the offending commit(s). Every pushed commit
#     is checked on its own (not only the combined diff), force-pushes that rewrite
#     main's history are reported, and so are pushes too large to check completely.
#   - Push to main, daily schedule and manual run: main's README is audited as a whole
#     against Dortania's own README. Everyone credited there (plus a fixed fallback list)
#     must be credited here. This doesn't trust main: a removal that already landed on
#     main (issue closed, guard bypassed or failing at the time) is still found, and the
#     scheduled run keeps one issue open until it is fixed.
# Code is only inspected through the API (diff patches), never executed.
#
# Pushes are only checked on main: watching every branch let one push of many
# branches (e.g. `git push --all`) start a run per branch at the same time, each
# hammering the API and opening its own issue. Other branches reach main through
# a pull request (checked above) or a push to main (checked here).
#
# Limits: a push runs the workflow file from the pushed commit, so someone who can push
# to main can also change this guard in the same push. Protect main with a ruleset
# (require pull requests, block force pushes, CODEOWNERS review for .github/) so changes
# to the guards themselves need review.

name: Attribution guard

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
  push:
    branches: [main]
  schedule:
    - cron: "37 3 * * *"   # daily audit of main
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

# One run per PR (a newer push to the PR supersedes the older run); pushes to
# main queue behind each other instead of running in parallel, so the
# "issue already exists" check can't race and open duplicates.
concurrency:
  group: attribution-guard-${{ github.event_name == 'pull_request_target' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check for removed Dortania attribution and credits
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const MARKER = '<!-- attribution-guard -->';

            // Upstream authors whose notices must never be removed or replaced
            const AUTHORS = 'dortania|dhinak\\s*g|dhinakg|mykola\\s*grymalyuk|khronokernel|acidanthera|vit9696|individual contributors|opencore legacy patcher contributors';
            // A line that carries an upstream copyright / attribution notice
            const NOTICE = new RegExp(
              `(copyright|\\(c\\)|©|all rights reserved|developed by|licen[sc]ed? (to|by)|authors?:)[^\\n]*(${AUTHORS})` +
              `|(${AUTHORS})[^\\n]*(copyright|\\(c\\)|©|all rights reserved)` +
              `|\\b(19|20)\\d{2}(\\s*[-–]\\s*(19|20)\\d{2})?,?\\s+(${AUTHORS})\\b`, 'i');
            // Licence files: no line of the UPSTREAM (Dortania) licence may be dropped (year updates are fine).
            // Lines this fork added itself (e.g. its own copyright or terms for its own changes) may be edited.
            const LICENSE_FILE = /(^|\/)(LICEN[SC]E|COPYING|NOTICE)(\.[a-z]+)?$/i;
            const normYears = l => l.replace(/\b(19|20)\d{2}(\s*[-–]\s*(19|20)\d{2})?/g, 'YEAR').replace(/\s+/g, ' ').trim();

            // Normalised lines of Dortania's own licence file(s), fetched once per run
            const upstreamLicence = new Map();
            async function upstreamLicenceLines(path) {
              if (upstreamLicence.has(path)) return upstreamLicence.get(path);
              let set = null; // null = upstream has no such file -> protect every line
              try {
                const { data } = await github.rest.repos.getContent({ owner: 'dortania', repo: 'OpenCore-Legacy-Patcher', path });
                set = new Set(Buffer.from(data.content, 'base64').toString('utf8').split('\n').map(normYears).filter(Boolean));
              } catch (e) { if (e.status !== 404) core.warning(`Could not read upstream ${path}: ${e.message}`); }
              upstreamLicence.set(path, set);
              return set;
            }

            // Relocated notices: files deleted here because they now live elsewhere (see the file).
            // Read from trusted refs only (PR base / commit before the push), never from the change itself.
            // In a fork, the original repository's default branch counts as trusted too: entries there
            // were already reviewed upstream. Without it, a fork syncing an upstream relocation reads the
            // list from its own older commit (where the entry doesn't exist yet) and reports the deletion.
            const RELOCATED_FILE = '.github/relocated-notices.txt';
            const globRe = g => new RegExp('^' + g.replace(/[.+^${}()|[\]\\]/g, '\\$&').replace(/\*+/g, '.*').replace(/\?/g, '.') + '$');
            async function trustedSources(ref) {
              const list = [{ o: owner, r: repo, ref }];
              try {
                const { data } = await github.rest.repos.get({ owner, repo });
                const src = data.fork && (data.source || data.parent);
                if (src) list.push({ o: src.owner.login, r: src.name, ref: src.default_branch });
              } catch (e) { core.warning(`Could not read repository info: ${e.message}`); }
              return list;
            }
            async function loadRelocated(ref) {
              const entries = [];
              for (const s of await trustedSources(ref)) {
                try {
                  const { data } = await github.rest.repos.getContent({ owner: s.o, repo: s.r, path: RELOCATED_FILE, ref: s.ref });
                  entries.push(...Buffer.from(data.content, 'base64').toString('utf8').split('\n')
                    .map(l => l.split('#')[0].trim()).filter(l => l.includes('->'))
                    .map(l => { const [p, d] = l.split('->').map(x => x.trim()); return { re: globRe(p), dest: d }; })
                    .filter(e => e.dest));
                } catch (e) { if (e.status !== 404) core.warning(`Could not read ${s.o}/${s.r}:${RELOCATED_FILE}: ${e.message}`); }
              }
              return entries;
            }

            async function scan(files, relocated = []) {
              const findings = [];
              for (const f of files) {
                // Workflow files contain the detection patterns themselves (false positives).
                // PRs can't weaken the guard this way: pull_request_target always runs the
                // version from the base branch, not the one in the PR.
                // Same for License Guard's script and allowlist, which quote copyright notices in comments/regexes.
                if (/^\.github\/workflows\//.test(f.filename) || ['.github/scripts/license_guard.py', '.github/license-guard-allow.txt', RELOCATED_FILE].includes(f.filename)) continue;
                // Deleted on purpose because the file and its notices now live elsewhere
                if (f.status === 'removed' && relocated.some(r => r.re.test(f.filename))) continue;
                if (LICENSE_FILE.test(f.filename) && f.status === 'removed') {
                  findings.push({ file: f.filename, reason: 'Licence file deleted', removed: [], added: [] });
                  continue;
                }
                if (!f.patch) continue; // binary or too large for the API
                const removed = [], added = [], addedCopyright = [];
                for (const line of f.patch.split('\n')) {
                  if (line.startsWith('---') || line.startsWith('+++')) continue;
                  const text = line.slice(1).trim();
                  if (line.startsWith('-') && NOTICE.test(text)) removed.push(text);
                  if (line.startsWith('+') && NOTICE.test(text)) added.push(text);
                  if (line.startsWith('+') && /(copyright|\(c\)|©)/i.test(text) && !new RegExp(AUTHORS, 'i').test(text)) addedCopyright.push(text);
                }
                if (LICENSE_FILE.test(f.filename)) {
                  const rem = [], add = new Set();
                  for (const line of f.patch.split('\n')) {
                    if (line.startsWith('---') || line.startsWith('+++')) continue;
                    if (line.startsWith('-') && line.slice(1).trim()) rem.push(line.slice(1).trim());
                    if (line.startsWith('+')) add.add(normYears(line.slice(1)));
                  }
                  const upstream = await upstreamLicenceLines(f.filename);
                  const dropped = rem.filter(l => !add.has(normYears(l)) && (!upstream || upstream.has(normYears(l))));
                  if (dropped.length) {
                    findings.push({ file: f.filename, reason: 'Licence text removed or changed', removed: dropped, added: [] });
                    continue;
                  }
                }
                // Updating the year or moving a notice keeps the count equal; losing one does not
                if (removed.length > added.length) {
                  findings.push({
                    file: f.filename,
                    reason: addedCopyright.length ? 'Upstream attribution replaced' : 'Upstream attribution removed',
                    removed: removed.filter(r => !added.includes(r)),
                    added: addedCopyright,
                  });
                }
              }
              return findings;
            }

            function report(findings) {
              return findings.map(f => {
                let s = `- \`${f.file}\`: ${f.reason}`;
                for (const l of f.removed.slice(0, 5)) s += `\n  - removed: \`${l.replace(/`/g, "'")}\``;
                for (const l of f.added.slice(0, 5)) s += `\n  - added: \`${l.replace(/`/g, "'")}\``;
                return s;
              }).join('\n');
            }

            // ---------- README credits for upstream (Dortania) authors ----------
            // Protected = everyone credited in Dortania's own README, plus a fixed fallback list
            const FALLBACK_UPSTREAM = ['dortania','acidanthera','dhinakg','khronokernel','vit9696','asentientbot',
              'parrotgeek1','flagersgit','jazzzny','covasedu','arter97','joevt','mariobrostech','ausdauersportler'];
            async function readReadme(o, r, ref) {
              try {
                const { data } = await github.rest.repos.getContent({ owner: o, repo: r, path: 'README.md', ...(ref ? { ref } : {}) });
                return Buffer.from(data.content, 'base64').toString('utf8');
              } catch (e) { if (e.status === 404) return ''; throw e; }
            }
            function creditsSection(md) {
              const m = md.match(/^#{1,3}\s*credits\b.*$/im);
              if (!m) return '';
              const rest = md.slice(m.index + m[0].length);
              const next = rest.search(/^#{1,2}\s+\S/m);
              return next === -1 ? rest : rest.slice(0, next);
            }
            function creditedLogins(section) {
              const set = new Set();
              for (const m of section.matchAll(/github\.com\/([A-Za-z0-9-]+)/g)) set.add(m[1].toLowerCase());
              return set;
            }
            async function upstreamAuthors() {
              const set = new Set(FALLBACK_UPSTREAM);
              try {
                const md = await readReadme('dortania', 'OpenCore-Legacy-Patcher');
                for (const l of creditedLogins(creditsSection(md))) set.add(l);
              } catch (e) { core.warning(`Could not read Dortania README, using fallback list: ${e.message}`); }
              return set;
            }
            async function readmeFindings(baseRef, headOwner, headRepo, headRef) {
              const protectedSet = await upstreamAuthors();
              const before = creditedLogins(creditsSection(await readReadme(owner, repo, baseRef)));
              const after = creditedLogins(creditsSection(await readReadme(headOwner, headRepo, headRef)));
              const gone = [...before].filter(l => protectedSet.has(l) && !after.has(l));
              return gone.length ? [{ file: 'README.md', reason: 'Upstream (Dortania) authors removed from Credits',
                removed: gone.map(l => `https://github.com/${l}`), added: [] }] : [];
            }

            // Whole-README audit that doesn't trust main: everyone credited in Dortania's README
            // (plus the fallback list) must be credited at `ref`, whatever main looked like before.
            async function stateFindings(ref) {
              const required = await upstreamAuthors();
              const have = creditedLogins(creditsSection(await readReadme(owner, repo, ref)));
              const missing = [...required].filter(l => !have.has(l)).sort();
              return missing.length ? [{ file: 'README.md', reason: 'Credits are missing authors credited in Dortania\'s README',
                removed: missing.map(l => `https://github.com/${l}`), added: [] }] : [];
            }

            // One commit checked on its own (diff against its first parent), so a violation can't
            // hide in a push's combined diff and the report names the commit that made it.
            // Exclusions (relocated notices) come from the trusted ref of the push, as before.
            const MAX_COMMIT_FILES = 3000; // the API lists at most 3000 files per commit
            async function commitFindings(sha, relocated) {
              const files = [];
              let data;
              for (let page = 1; page <= MAX_COMMIT_FILES / 100; page++) {
                ({ data } = await github.rest.repos.getCommit({ owner, repo, ref: sha, per_page: 100, page }));
                files.push(...(data.files || []));
                if ((data.files || []).length < 100) break;
              }
              const short = sha.slice(0, 7);
              const findings = await scan(files, relocated);
              const parent = data.parents && data.parents[0] && data.parents[0].sha;
              if (parent && files.some(f => f.filename === 'README.md')) {
                findings.push(...await readmeFindings(parent, owner, repo, sha));
              }
              if (files.length >= MAX_COMMIT_FILES) {
                findings.push({ file: '(commit)', reason: `Too many changed files to check through the API (${files.length}+); review this commit by hand`, removed: [], added: [] });
              }
              return findings.map(f => ({ ...f, file: `${short}: ${f.file}` }));
            }

            const POLICY = [
              'This project is based on Dortania\'s OpenCore Legacy Patcher / PatcherSupportPkg.',
              'Removing, replacing or rewriting the copyright, licence or credit notices of Dortania and its authors (Dhinak G, Mykola Grymalyuk and contributors) violates the licence',
              'and is not allowed, no matter who makes the change. Keep the original notices intact; you may add',
              'your own credit **next to** them (keep `Copyright (c) 2020-2025 Dhinak G, Mykola Grymalyuk, and individual contributors.` and add a separate line for your own changes).',
            ].join(' ');

            // ---------- Pull requests: close immediately ----------
            if (context.eventName === 'pull_request_target') {
              const pr = context.payload.pull_request;
              if (pr.state !== 'open') return;
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner, repo, pull_number: pr.number, per_page: 100,
              });
              const findings = await scan(files, await loadRelocated(pr.base.sha));
              if (files.some(f => f.filename === 'README.md')) {
                const { data: c } = await github.rest.repos.compareCommitsWithBasehead({
                  owner, repo, basehead: `${pr.base.sha}...${pr.head.sha}`,
                });
                const headOwner = pr.head.repo ? pr.head.repo.owner.login : owner;
                const headRepo  = pr.head.repo ? pr.head.repo.name : repo;
                findings.push(...await readmeFindings(c.merge_base_commit.sha, headOwner, headRepo, pr.head.sha));
              }
              if (!findings.length) { core.info('No attribution violation found.'); return; }

              const body = [
                MARKER,
                '> [!CAUTION]',
                '> **This pull request was closed automatically because it removes or alters Dortania\'s copyright, licence or credit notices.**',
                '',
                POLICY,
                '',
                '**Detected changes:**',
                report(findings),
                '',
                'Please restore the original notices. If you think this was a false positive, reply here and a maintainer will review it.',
              ].join('\n');

              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
              try {
                await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: ['attribution-violation'] });
              } catch (e) { core.warning(`Could not add label: ${e.message}`); }
              await github.rest.pulls.update({ owner, repo, pull_number: pr.number, state: 'closed' });
              core.setFailed('Attribution violation detected, PR closed.');
              return;
            }

            // ---------- Audit of main as a whole: ONE issue, kept up to date ----------
            // Used by pushes, the daily schedule and manual runs. It is closed automatically once
            // main is fixed, and a new one is opened if it gets closed while credits are still missing.
            const AUDIT_TITLE = 'Attribution audit: credits missing on main';
            async function updateAuditIssue(findings, branch) {
              const open = (await github.paginate(github.rest.issues.listForRepo, {
                owner, repo, state: 'open', labels: 'attribution-violation', per_page: 100,
              })).filter(i => !i.pull_request && i.title === AUDIT_TITLE);
              if (!findings.length) {
                for (const i of open) {
                  await github.rest.issues.createComment({ owner, repo, issue_number: i.number,
                    body: `${MARKER}\n✅ Every upstream author is credited on \`${branch}\` again. Closing.` });
                  await github.rest.issues.update({ owner, repo, issue_number: i.number, state: 'closed', state_reason: 'completed' });
                }
                return;
              }
              const body = [
                MARKER,
                '> [!CAUTION]',
                `> **\`${branch}\` doesn't credit everyone who is credited in Dortania's own README.**`,
                '',
                POLICY,
                '',
                'This audit checks the README on main as a whole against Dortania\'s README, so it also finds removals that got past the checks on pull requests and pushes.',
                '',
                '**Missing:**',
                report(findings),
                '',
                'Restore these credits. This issue is updated on every push and every day, and closed automatically once main is fixed.',
              ].join('\n');
              if (open.length) await github.rest.issues.update({ owner, repo, issue_number: open[0].number, body });
              else await github.rest.issues.create({ owner, repo, title: AUDIT_TITLE, body, labels: ['attribution-violation'] });
            }

            if (context.eventName === 'schedule' || context.eventName === 'workflow_dispatch') {
              const { data: info } = await github.rest.repos.get({ owner, repo });
              const findings = await stateFindings(info.default_branch);
              await updateAuditIssue(findings, info.default_branch);
              if (findings.length) core.setFailed('Audit: upstream authors missing from the Credits on main.');
              else core.info('Audit: every upstream author is credited on main.');
              return;
            }

            // ---------- Pushes: open an issue ----------
            const { before, after } = context.payload;
            if (/^0+$/.test(after)) return; // branch deleted
            const branch = context.ref.replace('refs/heads/', '');
            let base = before;
            if (!base || /^0+$/.test(base)) {
              // New branch: compare against the default branch
              base = context.payload.repository.default_branch;
            }

            // Whole-README audit of the pushed state (doesn't trust what main looked like before)
            const auditFindings = await stateFindings(after);
            await updateAuditIssue(auditFindings, branch);

            const findings = [];
            const relocated = await loadRelocated(base);
            const MAX_COMMITS = 500;
            let cmp = null, commits = [];
            try {
              for (let page = 1; ; page++) {
                const { data } = await github.rest.repos.compareCommitsWithBasehead({
                  owner, repo, basehead: `${base}...${after}`, per_page: 100, page,
                });
                if (!cmp) cmp = data;
                commits.push(...(data.commits || []));
                if ((data.commits || []).length < 100 || commits.length >= Math.min(MAX_COMMITS, data.total_commits)) break;
              }
            } catch (e) {
              findings.push({ file: '(push)', reason: `Could not compare ${base.slice(0, 7)}...${after.slice(0, 7)} (${e.message}); review this push by hand`, removed: [], added: [] });
            }

            if (cmp) {
              // A force-push that drops commits rewrites main's history and can hide earlier changes
              if (context.payload.forced || cmp.behind_by > 0) {
                findings.push({ file: '(history)', reason: `Force-push to \`${branch}\`: ${cmp.behind_by} commit(s) of the previous history were dropped`, removed: [], added: [] });
              }
              // Every commit on its own, so a removal can't hide in the combined diff
              for (const c of commits) findings.push(...await commitFindings(c.sha, relocated));
              if (cmp.total_commits > commits.length) {
                // Too many commits to check one by one: fall back to the combined diff for the rest
                findings.push({ file: '(push)', reason: `Only ${commits.length} of ${cmp.total_commits} commits were checked one by one; the combined diff was checked too`, removed: [], added: [] });
                findings.push(...await scan(cmp.files || [], relocated));
                if ((cmp.files || []).some(f => f.filename === 'README.md')) {
                  findings.push(...await readmeFindings(cmp.merge_base_commit.sha, owner, repo, after));
                }
              }
            }

            if (!findings.length) {
              if (auditFindings.length) core.setFailed('Audit: upstream authors missing from the Credits on main.');
              else core.info('No attribution violation found.');
              return;
            }

            const shortSha = after.slice(0, 7);
            const title = `Attribution violation in ${branch} (${shortSha})`;

            // Don't open the same issue twice
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'attribution-violation', per_page: 100,
            });
            if (open.some(i => i.title === title)) { core.setFailed('Attribution violation detected, issue already exists.'); return; }

            const commitList = commits.map(c =>
              `- [\`${c.sha.slice(0, 7)}\`](${c.html_url}) ${c.commit.message.split('\n')[0]} — @${c.author ? c.author.login : c.commit.author.name}`
            ).join('\n');

            const body = [
              MARKER,
              '> [!CAUTION]',
              `> **A push to \`${branch}\` removed or altered Dortania's copyright, licence or credit notices, or rewrote its history.**`,
              '',
              POLICY,
              '',
              `**Pushed by:** @${context.actor}`,
              cmp ? `**Compare:** ${cmp.html_url}` : '',
              '',
              '**Commits:**',
              commitList || '_none listed_',
              '',
              '**Detected changes** (prefixed with the commit that made them):',
              report(findings),
              '',
              'Please revert or restore the original notices and close this issue afterwards.',
            ].join('\n');

            await github.rest.issues.create({
              owner, repo, title, body, labels: ['attribution-violation'],
            });
            core.setFailed('Attribution violation detected, issue opened.');
