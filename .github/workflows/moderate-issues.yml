name: Moderate issues

on:
  issues:
    types: [opened, edited]
  # Malware "fixes" usually arrive as comments on existing issues,
  # and a harmless comment can be edited into one later
  issue_comment:
    types: [created, edited]

permissions:
  contents: write   # commit the tracking file
  issues: write

# One group per comment / issue, NOT one for the whole repo: GitHub keeps only
# one pending run per group and cancels the rest, so a single shared group meant
# that during a spam wave every issue/comment between the running and the newest
# one was never moderated. Edits of the same comment/issue still queue (the
# newest content wins). Concurrent commits to the log are handled below.
concurrency:
  group: moderation-${{ github.event.comment.id && format('comment-{0}', github.event.comment.id) || format('issue-{0}', github.event.issue.number) }}
  cancel-in-progress: false

jobs:
  moderate:
    # Never moderate yourself, collaborators or bots (e.g. the other issue bots)
    if: >-
      (github.event_name == 'issues' &&
       !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
      (github.event_name == 'issue_comment' &&
       github.event.comment.user.type != 'Bot' &&
       !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check issue/comment, delete, block
        env:
          # MODERATION_TOKEN (PAT) is optional; falls back to the built-in token
          GH_TOKEN: ${{ secrets.MODERATION_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_ADMIN_TOKEN: ${{ secrets.MODERATION_TOKEN != '' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REPO: ${{ github.repository }}
        run: python .github/scripts/moderate_issue.py

      - name: Commit tracking file
        run: |
          if [ -n "$(git status --porcelain moderation/)" ]; then
            git config user.name "moderation-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add moderation/
            git commit -m "Moderation: log removed issue/comment [skip ci]"
            # Runs for different comments can log at the same time. The log only
            # gets rows appended, so keep both sides' rows when they meet.
            echo 'moderation/flagged-issues.md merge=union' >> .git/info/attributes
            for delay in 2 4 8 16 32 0; do
              git pull --rebase && git push && exit 0
              git rebase --abort 2>/dev/null || true
              [ "$delay" = 0 ] && break
              sleep "$delay"
            done
            echo "::error::Could not push the moderation log"
            exit 1
          fi
