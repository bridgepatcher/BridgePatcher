name: Publish SHA256SUMS

# Generates a single SHA256SUMS file covering every asset attached to a release
# and uploads it back to that same release - unattended.
#
# GitHub fires no event when an asset is uploaded, only when the release itself is
# published or edited. So this runs on two paths:
#   1. release events, then waits for the asset list to stop growing before hashing
#   2. a cron sweep that backfills any recent release still missing SHA256SUMS,
#      which covers uploads that arrive long after the release went live
#
# Hashing only starts once the installer, BridgePatcher.pkg, is attached. The
# pre-rename name OpenCore-Patcher-T2.pkg is no longer built or accepted by the
# updater, so it isn't waited for. A release that never gets BridgePatcher.pkg is
# still hashed once its assets stop changing and MAX_WAIT_SECONDS has passed, with
# a warning.
#
# SHA256SUMS is the only checksum file on releases. The old certificates.txt is no
# longer built or uploaded; the in-app updater only falls back to it for older
# releases that still carry one.
#
# SHA256SUMS is regenerated whenever the assets change, so on its own it would also
# vouch for a replaced (e.g. malicious) package. The same checksums are therefore
# also recorded by .github/scripts/record_checksums.py:
#   - in CHECKSUMS.md on the default branch, append-only: a checksum is never changed
#     or removed, and git history shows when it was first recorded. If an asset's
#     SHA256 later differs from the first one, the new one is added under a warning
#     and this workflow fails, so the maintainer gets notified.
#   - in the release notes, under "## Asset Information" (the in-app updater cuts the
#     changelog at that heading, so they don't show up there).
# Older releases can be backfilled by running this workflow with their tag.

on:
  release:
    types: [published, released, prereleased, edited]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (leave empty to scan recent releases)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: sha256sums-${{ github.event.release.tag_name || inputs.tag || 'scan' }}
  cancel-in-progress: false

jobs:
  sha256sums:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Asset list must stay unchanged across one poll before hashing starts.
      SETTLE_SECONDS: "60"
      MAX_WAIT_SECONDS: "1200"
      # Cron sweep only looks at releases this recent, to avoid re-downloading
      # the whole release history on every run.
      SCAN_DAYS: "7"
      SCAN_LIMIT: "10"
      # Installer packages. Space separated, no spaces in names.
      INSTALLER_ASSETS: "BridgePatcher.pkg"
      PRIMARY_INSTALLER: "BridgePatcher.pkg"
    steps:
      - name: Find default branch
        id: repo
        run: echo "branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)" >> "$GITHUB_OUTPUT"

      # CHECKSUMS.md is committed to the default branch, and the recording script is
      # taken from there too (a release's own tag may predate it). Full history so the
      # release notes can link the commit that first recorded a release.
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.repo.outputs.branch }}
          path: repo
          fetch-depth: 0

      - name: Determine target releases
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${EVENT_TAG:-${INPUT_TAG:-}}"
          if [ -n "$TAG" ]; then
            printf '%s\n' "$TAG" > tags.txt
          else
            CUTOFF="$(date -u -d "-${SCAN_DAYS} days" +%Y-%m-%dT%H:%M:%SZ)"
            gh release list --repo "$GITHUB_REPOSITORY" --limit "$SCAN_LIMIT" \
              --json tagName,publishedAt,isDraft \
              --jq "[.[] | select(.isDraft == false) | select(.publishedAt >= \"$CUTOFF\")] | .[].tagName" \
              > tags.txt
          fi
          echo "Target releases:"
          cat tags.txt

      - name: Generate and upload SHA256SUMS, record checksums
        run: |
          set -euo pipefail
          CHANGED=0
          FAILED=0

          process() {
            TAG="$1"
            echo "::group::$TAG"

            # Wait until an installer is attached and the asset count stops
            # changing. Protects against the release being published before the
            # pkgs finish uploading.
            PREV=-1
            WAITED=0
            while true; do
              NAMES="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
                --jq '.assets[] | select(.name != "SHA256SUMS") | .name')"
              COUNT="$(printf '%s\n' "$NAMES" | grep -c . || true)"
              FOUND=""
              for pkg in $INSTALLER_ASSETS; do
                if printf '%s\n' "$NAMES" | grep -qxF "$pkg"; then
                  FOUND="$FOUND $pkg"
                fi
              done
              if [ "$COUNT" -gt 0 ] && [ "$COUNT" -eq "$PREV" ]; then
                if [ -n "$FOUND" ]; then
                  break
                fi
                if [ "$WAITED" -ge "$MAX_WAIT_SECONDS" ]; then
                  echo "::warning::$TAG has no installer ($INSTALLER_ASSETS) - hashing its $COUNT asset(s) anyway."
                  break
                fi
              fi
              if [ "$WAITED" -ge "$MAX_WAIT_SECONDS" ]; then
                echo "Timed out waiting for assets on $TAG (currently $COUNT) - the cron sweep will retry."
                echo "::endgroup::"
                return 0
              fi
              PREV="$COUNT"
              sleep "$SETTLE_SECONDS"
              WAITED=$((WAITED + SETTLE_SECONDS))
            done

            rm -rf work
            mkdir -p work
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir work --clobber

            if [ -f work/SHA256SUMS ]; then
              mv work/SHA256SUMS existing.txt
            else
              rm -f existing.txt
            fi

            (cd work && LC_ALL=C find . -maxdepth 1 -type f -printf '%P\n' \
              | LC_ALL=C sort \
              | xargs -d '\n' -r sha256sum) > SHA256SUMS

            # Every installer on the release must be covered
            for pkg in $FOUND; do
              if ! awk -v f="$pkg" '$2 == f { found = 1 } END { exit !found }' SHA256SUMS; then
                echo "::error::$pkg is attached to $TAG but missing from SHA256SUMS."
                exit 1
              fi
            done
            case " $FOUND " in
              *" $PRIMARY_INSTALLER "*) ;;
              *" "*[a-zA-Z]*) echo "::notice::$TAG has no $PRIMARY_INSTALLER, only:$FOUND" ;;
            esac

            if [ ! -s SHA256SUMS ]; then
              echo "Nothing to hash for $TAG."
            elif [ -f existing.txt ] && cmp -s existing.txt SHA256SUMS; then
              echo "SHA256SUMS already up to date for $TAG."
            else
              cat SHA256SUMS
              gh release upload "$TAG" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
            fi

            # Append-only record in CHECKSUMS.md and the release notes (see the top of this file)
            if [ -s SHA256SUMS ]; then
              rc=0
              python3 -I repo/.github/scripts/record_checksums.py \
                --tag "$TAG" --sums SHA256SUMS --checkout repo || rc=$?
              case "$rc" in
                0) ;;
                3) CHANGED=1 ;;
                *) FAILED=1 ;;
              esac
            fi

            rm -rf work existing.txt SHA256SUMS
            echo "::endgroup::"
          }

          while read -r t; do
            [ -n "$t" ] && process "$t"
          done < tags.txt

          if [ "$CHANGED" -ne 0 ]; then
            echo "::error::A release asset was replaced after its checksum was first recorded - see the errors above and CHECKSUMS.md."
            exit 1
          fi
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::Recording checksums failed for at least one release - see the errors above."
            exit 1
          fi
