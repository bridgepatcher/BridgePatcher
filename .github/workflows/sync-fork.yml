name: Sync fork with upstream

# Only for forks and copies of BridgePatcher: this job never runs in
# bridgepatcher/BridgePatcher itself.
#
# Once a day it looks at this repository's default branch. If the latest commit
# there is more than 19 days old and upstream main has commits it doesn't have,
# it brings them in (a fast-forward when possible, otherwise a merge commit) and
# pushes. A copy that is already up to date, or that got a commit in the last
# 19 days, is left alone. On a merge conflict nothing is pushed and the run fails
# so you can sync by hand.
#
# Setting it up in your fork or copy:
#   1. GitHub turns off workflows in new forks: open the Actions tab and enable them.
#   2. Upstream changes often touch .github/workflows, and GitHub never lets the
#      built-in GITHUB_TOKEN push those. Create a fine-grained token for your
#      repository with "Contents: Read and write" and "Workflows: Read and write"
#      (or a classic token with the "repo" and "workflow" scopes) and save it as
#      the repository secret FORK_SYNC_TOKEN. Without it, a sync that includes
#      workflow changes fails with a message saying so.
#
# Run it by hand from the Actions tab ("Run workflow"); tick "force" to sync even
# if the default branch was updated less than 19 days ago.

on:
  schedule:
    - cron: "17 5 * * *"   # daily, 05:17 UTC
  workflow_dispatch:
    inputs:
      force:
        description: Sync even if the default branch was updated in the last 19 days
        type: boolean
        default: false

permissions: {}

concurrency:
  group: sync-fork
  cancel-in-progress: false

jobs:
  sync:
    # String comparisons in expressions ignore case.
    if: github.repository != 'bridgepatcher/BridgePatcher'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      UPSTREAM: bridgepatcher/BridgePatcher
      UPSTREAM_BRANCH: main
      MAX_AGE_DAYS: 19
      BRANCH: ${{ github.event.repository.default_branch }}
      FORCE: ${{ inputs.force || false }}
      PUSH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN || github.token }}
      HAS_SYNC_TOKEN: ${{ secrets.FORK_SYNC_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Merge upstream main if this copy is more than 19 days old
        run: |
          set -euo pipefail
          git config core.hooksPath /dev/null
          note() { printf '%s\n' "$*" | tee -a "$GITHUB_STEP_SUMMARY"; }

          git remote add upstream "https://github.com/${UPSTREAM}.git"
          git fetch -q upstream "refs/heads/${UPSTREAM_BRANCH}"
          upstream_sha=$(git rev-parse FETCH_HEAD)

          behind=$(git rev-list --count "HEAD..${upstream_sha}")
          if [ "$behind" -eq 0 ]; then
            note "\`${BRANCH}\` already has everything from ${UPSTREAM}@${UPSTREAM_BRANCH}."
            exit 0
          fi

          last_commit=$(git log -1 --format=%ct HEAD)
          age=$(( $(date +%s) - last_commit ))
          age_days=$(( age / 86400 ))
          if [ "$age" -le $(( MAX_AGE_DAYS * 86400 )) ] && [ "$FORCE" != true ]; then
            note "\`${BRANCH}\` was last updated ${age_days} day(s) ago, not more than ${MAX_AGE_DAYS}: leaving it alone (${behind} upstream commit(s) waiting)."
            exit 0
          fi

          if git merge-base --is-ancestor HEAD "$upstream_sha"; then
            git merge -q --ff-only "$upstream_sha"
            how="Fast-forwarded \`${BRANCH}\` to ${UPSTREAM}@${UPSTREAM_BRANCH}"
          elif git -c user.name="github-actions[bot]" \
                   -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                   merge -q --no-edit -m "Merge ${UPSTREAM}@${UPSTREAM_BRANCH} into ${BRANCH}" \
                   -m "Generated by the sync-fork workflow." "$upstream_sha"; then
            how="Merged ${UPSTREAM}@${UPSTREAM_BRANCH} into \`${BRANCH}\`"
          else
            git merge --abort || true
            note "Merging ${UPSTREAM}@${UPSTREAM_BRANCH} into \`${BRANCH}\` conflicts with your own commits. Nothing was pushed."
            echo "::error::Merge conflict with ${UPSTREAM}@${UPSTREAM_BRANCH}; sync this repository by hand"
            exit 1
          fi

          remote="https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git push -q "$remote" "HEAD:refs/heads/${BRANCH}" 2> "$RUNNER_TEMP/push.err"; then
            sed "s/${PUSH_TOKEN}/***/g" "$RUNNER_TEMP/push.err" >&2
            if grep -qi 'workflow' "$RUNNER_TEMP/push.err"; then
              if [ "$HAS_SYNC_TOKEN" = true ]; then
                echo "::error::FORK_SYNC_TOKEN may not change workflow files; give it the Workflows permission (or the classic \"workflow\" scope)"
              else
                echo "::error::Upstream changed files in .github/workflows, which GITHUB_TOKEN may not push. Add a FORK_SYNC_TOKEN secret (see the comment at the top of this workflow)"
              fi
            else
              echo "::error::Could not push to ${BRANCH}"
            fi
            exit 1
          fi

          note "${how} ($(git rev-parse --short HEAD)): ${behind} new commit(s); it was last updated ${age_days} day(s) ago."
