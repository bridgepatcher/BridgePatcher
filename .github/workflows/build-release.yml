name: CI - Build BridgePatcher

on:
  push:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build BridgePatcher
    runs-on: macos-15

    env:
      # GitHub Information
      branch: ${{ github.ref }}
      commiturl: ${{ github.event_name == 'push' && github.event.head_commit.url || github.event_name == 'release' && github.event.release.html_url || format('{0}/{1}/commit/{2}', github.server_url, github.repository, github.sha) }}
      commitdate: ${{ github.event_name == 'push' && github.event.head_commit.timestamp || github.event_name == 'release' && github.event.release.published_at || '' }}

      # Signing info
      APPLICATION_SIGNING_IDENTITY: ${{ secrets.APPLICATION_SIGNING_IDENTITY }}
      INSTALLER_SIGNING_IDENTITY: ${{ secrets.INSTALLER_SIGNING_IDENTITY }}
      NOTARIZATION_APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
      NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
      NOTARIZATION_TEAM_ID: ${{ secrets.NOTARIZATION_TEAM_ID }}

      # Release guard
      IGNORE_RELEASE_ARGS: ${{ github.event_name != 'release' && '--ignore-release' || '' }}
    steps:
      - name: Checkout BridgePatcher
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Import signing certificates
        env:
          SIGNING_CERTIFICATES_P12: ${{ secrets.SIGNING_CERTIFICATES_P12 }}
          SIGNING_CERTIFICATES_PASSWORD: ${{ secrets.SIGNING_CERTIFICATES_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$SIGNING_CERTIFICATES_P12" ]; then
            echo "::error::SIGNING_CERTIFICATES_P12 is not configured."
            exit 1
          fi

          KEYCHAIN="$RUNNER_TEMP/bridgepatcher-ci.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          echo "::add-mask::$KEYCHAIN_PASSWORD"

          # Decode the signing certificate.
          printf '%s' "$SIGNING_CERTIFICATES_P12" \
            | base64 -D > "$RUNNER_TEMP/certificates.p12"

          # Create the temporary keychain.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          # Register it immediately so the cleanup step can find it,
          # even if a later certificate-import operation fails.
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          # Import the signing certificates and allow the required tools
          # to access their private keys.
          security import "$RUNNER_TEMP/certificates.p12" \
            -k "$KEYCHAIN" \
            -P "$SIGNING_CERTIFICATES_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productsign \
            -T /usr/bin/pkgbuild \
            -T /usr/bin/productbuild

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN" > /dev/null

          # Make the temporary keychain available to the user session.
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')

          rm -f "$RUNNER_TEMP/certificates.p12"

          # List all identities, including self-signed certificates.
          security find-identity -p codesigning "$KEYCHAIN"

      - name: Prepare Assets (--prepare-assets)
        run: >
          source .bridgepatcher-venv/bin/activate && Build-Project.command
          --run-as-individual-steps --reset-dmg-cache
          --prepare-assets
          ${{ env.IGNORE_RELEASE_ARGS }}
          --use-python-openssl

      - name: Prepare Application (--prepare-application) (Release)
        if: github.event_name == 'release'
        run: >
            source .bridgepatcher-venv/bin/activate && Build-Project.command
            --git-branch "${{ env.branch }}" --git-commit-url "${{ env.commiturl }}" --git-commit-date "${{ env.commitdate }}"
            --reset-pyinstaller-cache
            --run-as-individual-steps
            --use-python-openssl
            --prepare-application
            --application-signing-identity "${{ env.APPLICATION_SIGNING_IDENTITY }}" 
            --notarization-apple-id "${{ env.NOTARIZATION_APPLE_ID }}" --notarization-team-id "${{ env.NOTARIZATION_TEAM_ID }}"
      - name: Prepare Application (--prepare-application) (Artifacts)
        if: github.event_name != 'release'
        run: >
          source .bridgepatcher-venv/bin/activate && Build-Project.command
          --git-branch "${{ env.branch }}" --git-commit-url "${{ env.commiturl }}" --git-commit-date "${{ env.commitdate }}"
          --reset-pyinstaller-cache
          --run-as-individual-steps
          --prepare-application
          ${{ env.IGNORE_RELEASE_ARGS }}
          --use-python-openssl
          --application-signing-identity "${{ env.APPLICATION_SIGNING_IDENTITY }}" 
          --notarization-apple-id "${{ env.NOTARIZATION_APPLE_ID }}" --notarization-team-id "${{ env.NOTARIZATION_TEAM_ID }}"

      - name: Prepare Package (--prepare-package)
        run: >
          source .bridgepatcher-venv/bin/activate && Build-Project.command
          --run-as-individual-steps
          --prepare-package
          ${{ env.IGNORE_RELEASE_ARGS }}
          --use-python-openssl
          --installer-signing-identity "${{ env.INSTALLER_SIGNING_IDENTITY }}"
          --notarization-apple-id "${{ env.NOTARIZATION_APPLE_ID }}" --notarization-team-id "${{ env.NOTARIZATION_TEAM_ID }}"

      - name: Upload AutoPkg Package to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoPkg-Assets.pkg
          path: ./dist/AutoPkg-Assets.pkg

      - name: Upload Installation Package to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BridgePatcher.pkg
          path: ./dist/BridgePatcher.pkg

      - name: Upload Uninstaller Package to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BridgePatcher-Uninstaller.pkg
          path: ./dist/BridgePatcher-Uninstaller.pkg

      - name: Upload AutoPkg Package to Release
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@e74ff71f7d8a4c4745b560a485cc5fdb9b5b999d
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./dist/AutoPkg-Assets.pkg
          tag: ${{ github.ref }}
          file_glob: true

      - name: Upload Installation Package to Release
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@e74ff71f7d8a4c4745b560a485cc5fdb9b5b999d
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./dist/BridgePatcher.pkg
          tag: ${{ github.ref }}
          file_glob: true

      - name: Upload Uninstaller Package to Release
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@e74ff71f7d8a4c4745b560a485cc5fdb9b5b999d
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./dist/BridgePatcher-Uninstaller.pkg
          tag: ${{ github.ref }}
          file_glob: true

      - name: Upload certificates to Release
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@e74ff71f7d8a4c4745b560a485cc5fdb9b5b999d
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./dist/certificates.txt
          tag: ${{ github.ref }}
          file_glob: true

      - name: Remove the signing keychain
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ] && [ -f "$SIGNING_KEYCHAIN" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi
