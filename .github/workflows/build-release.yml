name: CI - Build BridgePatcher

on:
  push:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build BridgePatcher
    runs-on: macos-15

    env:
      # GitHub Information
      branch: ${{ github.ref }}
      commiturl: ${{ github.event_name == 'push' && github.event.head_commit.url || github.event_name == 'release' && github.event.release.html_url || format('{0}/{1}/commit/{2}', github.server_url, github.repository, github.sha) }}
      commitdate: ${{ github.event_name == 'push' && github.event.head_commit.timestamp || github.event_name == 'release' && github.event.release.published_at || '' }}

      # Release guard
      IGNORE_RELEASE_ARGS: ${{ github.event_name != 'release' && '--ignore-release' || '' }}
    steps:
      - name: Checkout BridgePatcher
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      
      - name: Import BridgePatcher signing identity
        # Fail fast instead of hanging until the 6-hour job limit if any
        # `security` call ever blocks on an interactive authorization prompt.
        timeout-minutes: 5
        env:
          SIGNING_CERTIFICATES_P12: ${{ secrets.BRIDGEPATCHER_SIGNING_P12 }}
          SIGNING_CERTIFICATES_PASSWORD: ${{ secrets.BRIDGEPATCHER_SIGNING_P12_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          : "${SIGNING_CERTIFICATES_P12:?Missing signing certificate secret}"
          : "${SIGNING_CERTIFICATES_PASSWORD:?Missing signing certificate password}"

          KEYCHAIN="$RUNNER_TEMP/bridgepatcher-signing.keychain-db"
          P12="$RUNNER_TEMP/bridgepatcher-signing.p12"
          ROOT_CA="$GITHUB_WORKSPACE/ci_tooling/certificates/BridgePatcher-Root-CA.crt.pem"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          echo "::add-mask::$KEYCHAIN_PASSWORD"

          if [ ! -f "$ROOT_CA" ]; then
            echo "::error::Root CA certificate not found."
            exit 1
          fi

          # Decode the PKCS#12 signing identity.
          printf '%s' "$SIGNING_CERTIFICATES_P12" \
            | base64 -D > "$P12"

          shasum -a 256 "$P12"

          # Preserve the runner's original keychain search list.
          security list-keychains -d user \
            | sed 's/^[[:space:]]*"\(.*\)"[[:space:]]*$/\1/' \
            > "$RUNNER_TEMP/original-keychains.txt"

          # Create and unlock the temporary keychain.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          # Import the private signing identity.
          security import "$P12" \
            -k "$KEYCHAIN" \
            -P "$SIGNING_CERTIFICATES_PASSWORD" \
            -T /usr/bin/codesign

          # Permit Apple's signing tools to access the private key.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN" > /dev/null

          # Trust our private CA for code signing on this runner.
          #
          # This must run as root in the admin trust domain (-d). Changing the
          # *user* trust settings (no -d) asks SecurityAgent to show a GUI
          # authorization dialog, which nobody can answer on a headless runner,
          # so the step hangs forever right after "1 identity imported.".
          # `sudo` is passwordless on GitHub-hosted runners and root does not
          # need that authorization.
          sudo security add-trusted-cert \
            -d \
            -r trustRoot \
            -p codeSign \
            -k /Library/Keychains/System.keychain \
            "$ROOT_CA"

          # Add the temporary keychain to the user's search list.
          set --
          while IFS= read -r existing_keychain; do
            [ -n "$existing_keychain" ] && set -- "$@" "$existing_keychain"
          done < "$RUNNER_TEMP/original-keychains.txt"

          security list-keychains -d user -s "$KEYCHAIN" "$@"

          # Find the signing identity.
          IDENTITY_OUTPUT="$(security find-identity -v -p codesigning "$KEYCHAIN")"
          printf '%s\n' "$IDENTITY_OUTPUT"

          IDENTITY_HASHES="$(
            printf '%s\n' "$IDENTITY_OUTPUT" |
            awk '/^[[:space:]]*[0-9]+\)/ { print $2 }'
          )"

          IDENTITY_COUNT="$(
            printf '%s\n' "$IDENTITY_HASHES" |
            awk 'NF { count++ } END { print count+0 }'
          )"

          if [ "$IDENTITY_COUNT" -ne 1 ]; then
            echo "::error::Expected exactly one valid signing identity, found $IDENTITY_COUNT."
            exit 1
          fi

          CERT_SHA1="$(
            printf '%s\n' "$IDENTITY_HASHES" |
            awk 'NF { print; exit }'
          )"

          echo "Signing certificate SHA-1: $CERT_SHA1"

          # Make the identity and fingerprint available to subsequent steps.
          echo "APPLICATION_SIGNING_IDENTITY=$CERT_SHA1" >> "$GITHUB_ENV"
          echo "BRIDGEPATCHER_CERT_SHA1=$CERT_SHA1" >> "$GITHUB_ENV"

          # Remove the temporary PKCS#12 file.
          rm -f "$P12"

      - name: Build privileged helper with certificate pin
        shell: bash
        run: |
          set -euo pipefail

          make -C ci_tooling/privileged_helper_tool \
            clean release \
            CERT_SHA1="$BRIDGEPATCHER_CERT_SHA1"


      - name: Prepare Assets (--prepare-assets)
        run: >
          source .bridgepatcher-venv/bin/activate && Build-Project.command
          --run-as-individual-steps --reset-dmg-cache
          --prepare-assets
          ${{ env.IGNORE_RELEASE_ARGS }}
          --use-python-openssl

      - name: Prepare Application (--prepare-application) (Release)
        if: github.event_name == 'release'
        run: >
            source .bridgepatcher-venv/bin/activate && Build-Project.command
            --git-branch "${{ env.branch }}" --git-commit-url "${{ env.commiturl }}" --git-commit-date "${{ env.commitdate }}"
            --reset-pyinstaller-cache
            --run-as-individual-steps
            --use-python-openssl
            --prepare-application
            --application-signing-identity "$APPLICATION_SIGNING_IDENTITY"
      - name: Prepare Application (--prepare-application) (Artifacts)
        if: github.event_name != 'release'
        run: >
          source .bridgepatcher-venv/bin/activate && Build-Project.command
          --git-branch "${{ env.branch }}" --git-commit-url "${{ env.commiturl }}" --git-commit-date "${{ env.commitdate }}"
          --reset-pyinstaller-cache
          --run-as-individual-steps
          --prepare-application
          ${{ env.IGNORE_RELEASE_ARGS }}
          --use-python-openssl
          --application-signing-identity "$APPLICATION_SIGNING_IDENTITY" 

      - name: Prepare Package (--prepare-package)
        run: >
          source .bridgepatcher-venv/bin/activate && Build-Project.command
          --run-as-individual-steps
          --prepare-package
          ${{ env.IGNORE_RELEASE_ARGS }}
          --use-python-openssl
          --installer-signing-identity "$APPLICATION_SIGNING_IDENTITY"
          --notarization-apple-id "${{ env.NOTARIZATION_APPLE_ID }}" --notarization-team-id "${{ env.NOTARIZATION_TEAM_ID }}"

      - name: Upload AutoPkg Package to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoPkg-Assets.pkg
          path: ./dist/AutoPkg-Assets.pkg

      - name: Upload Installation Package to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BridgePatcher.pkg
          path: ./dist/BridgePatcher.pkg

      - name: Upload Uninstaller Package to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BridgePatcher-Uninstaller.pkg
          path: ./dist/BridgePatcher-Uninstaller.pkg

      - name: Upload AutoPkg Package to Release
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@e74ff71f7d8a4c4745b560a485cc5fdb9b5b999d
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./dist/AutoPkg-Assets.pkg
          tag: ${{ github.ref }}
          file_glob: true

      - name: Upload Installation Package to Release
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@e74ff71f7d8a4c4745b560a485cc5fdb9b5b999d
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./dist/BridgePatcher.pkg
          tag: ${{ github.ref }}
          file_glob: true

      - name: Upload Uninstaller Package to Release
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@e74ff71f7d8a4c4745b560a485cc5fdb9b5b999d
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./dist/BridgePatcher-Uninstaller.pkg
          tag: ${{ github.ref }}
          file_glob: true

      - name: Upload certificates to Release
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@e74ff71f7d8a4c4745b560a485cc5fdb9b5b999d
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./dist/certificates.txt
          tag: ${{ github.ref }}
          file_glob: true

      
      - name: Clean up signing material
        if: always()
        shell: bash
        run: |
          set +e

          rm -f "$RUNNER_TEMP/bridgepatcher-signing.p12"

          # Restore the original keychain search list.
          if [ -s "$RUNNER_TEMP/original-keychains.txt" ]; then
            set --

            while IFS= read -r existing_keychain; do
              [ -n "$existing_keychain" ] && set -- "$@" "$existing_keychain"
            done < "$RUNNER_TEMP/original-keychains.txt"

            security list-keychains -d user -s "$@"
          fi

          # Remove the private CA trust added during import.
          ROOT_CA="$GITHUB_WORKSPACE/ci_tooling/certificates/BridgePatcher-Root-CA.crt.pem"

          if [ -f "$ROOT_CA" ]; then
            sudo security remove-trusted-cert -d "$ROOT_CA"

            ROOT_CA_SHA1="$(
              openssl x509 -noout -fingerprint -sha1 -in "$ROOT_CA" |
              sed 's/^.*=//; s/://g'
            )"

            if [ -n "$ROOT_CA_SHA1" ]; then
              sudo security delete-certificate \
                -Z "$ROOT_CA_SHA1" \
                /Library/Keychains/System.keychain
            fi
          fi

          # Lock and delete the temporary signing keychain.
          KEYCHAIN="$RUNNER_TEMP/bridgepatcher-signing.keychain-db"

          if [ -f "$KEYCHAIN" ]; then
            security lock-keychain "$KEYCHAIN"
            security delete-keychain "$KEYCHAIN"
          fi
