name: Check T2 graphics settings

# Fails when a T2 EFI build contains Intel graphics settings that hang the boot at
# the Apple logo or leave the screen black: forced Apple GuC firmware (igfxfw=2),
# a framebuffer override on Macs whose own firmware values work, installer
# workaround boot-args leaking into normal builds (or missing from workaround
# builds), or a boot-arg given twice with different values. T2 Macs hung at the
# Apple logo unless the T2 Installer Workaround was enabled (fixed in 075e24b).
#
# .github/scripts/check_t2_graphics.py runs the real EFI builder for every T2
# model, built on the Mac itself and externally, with and without the
# workaround, for Sequoia and Tahoe hosts (see the script for the rules).
#
# Pull requests:
#   Read-only token, no write access - the check imports and runs the PR's
#   builder code. The check script itself always comes from the base branch, so
#   a PR can't change what is checked. Problems that already exist on the base
#   branch are listed separately and don't fail the PR. The result is in the
#   job summary.
#
# Outside pull requests (push to main, releases, weekly, manual):
#   The whole tree is checked and the result is kept in one tracking issue
#   ("T2 graphics check: settings that hang T2 Macs at the Apple logo on main").
#   It is opened when problems are found, updated on every run and closed
#   automatically once everything passes. A check that can't run at all is
#   reported too.

on:
  # No `paths` filter for PRs: with one, PRs that don't touch the builder get
  # no check at all (a required check would wait forever). The "Decide what to
  # check" step skips the expensive part instead.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    paths:
      - "bridgepatcher/**"
      - "payloads/Config/**"
      - "requirements.txt"
      - ".github/scripts/check_t2_graphics.py"
      - ".github/scripts/check_secure_boot_model.py"
      - ".github/workflows/t2-graphics-check.yml"
  release:
    types: [published]
  schedule:
    - cron: "45 6 * * 1"   # Mondays 06:45 UTC
  workflow_dispatch:

permissions: {}

# Runs from other branches (manual dispatches) share ONE group instead of one per
# branch, so starting this on many branches at once can't fan out into parallel runs.
concurrency:
  group: t2-graphics-${{ github.event.pull_request.number || ((github.ref == 'refs/heads/main' || github.ref_type == 'tag') && github.ref) || 'other-branches' }}
  cancel-in-progress: true

env:
  # What the builder imports besides the macOS-only modules (pyobjc, wx, ...),
  # which the script replaces with inert stubs on Linux.
  CHECK_DEPS: "requests packaging py_sip_xnu markdown markdown2"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    steps:
      # PRs that change nothing the builder or the check depends on pass right
      # away - their EFI builds are identical to main's, which is checked on push.
      - name: Decide what to check
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename'); then
            echo "::warning::Couldn't list the PR's files - checking everything"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          relevant=$(printf '%s\n' "$files" | grep -E '^(bridgepatcher/|payloads/Config/|requirements\.txt$|\.github/scripts/check_t2_graphics\.py$|\.github/scripts/check_secure_boot_model\.py$|\.github/workflows/t2-graphics-check\.yml$)' || true)
          if [ -n "$relevant" ]; then
            echo "Relevant changes:"; printf '  %s\n' $relevant
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "This PR doesn't change the EFI builder, payloads/Config or the check - nothing to check"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Nothing to check
        if: steps.scope.outputs.run != 'true'
        run: |
          echo "## T2 graphics check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ This PR doesn't change the EFI builder, \`payloads/Config\` or the check - nothing to check." >> "$GITHUB_STEP_SUMMARY"

      # Trusted copy: the base branch for PRs, otherwise the pushed/released commit.
      # The check script is always taken from here.
      - uses: actions/checkout@v4
        if: steps.scope.outputs.run == 'true'
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false

      # The PR (merged with its base, as GitHub tests it). Its code is executed
      # by the check - fine here, this job can't write anything.
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request' && steps.scope.outputs.run == 'true'
        with:
          path: pr
          persist-credentials: false

      - uses: actions/setup-python@v5
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: python3 -m pip install --quiet --disable-pip-version-check $CHECK_DEPS

      - name: Check T2 graphics settings
        id: check
        if: steps.scope.outputs.run == 'true'
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set +e
          out="$RUNNER_TEMP/t2-graphics"
          mkdir -p "$out"
          script="trusted/.github/scripts/check_t2_graphics.py"

          if [ ! -f "$script" ]; then
            # The base branch doesn't have the check yet (e.g. the PR that adds it)
            echo "::notice::$script doesn't exist on the base branch yet - nothing to check"
            echo "skipped" > "$out/skipped"
            echo "rc=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT" = "pull_request" ]; then
            python3 "$script" --root pr --baseline trusted \
              --json "$out/result.json" --summary "$out/summary.md"
          else
            python3 "$script" --root trusted \
              --json "$out/result.json" --summary "$out/summary.md"
          fi
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          [ -f "$out/summary.md" ] && cat "$out/summary.md" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t2-graphics-result
          path: ${{ runner.temp }}/t2-graphics/
          retention-days: 1
          if-no-files-found: ignore

      - name: Fail if a T2 build has graphics settings that hang the boot
        if: steps.check.outputs.rc != '' && steps.check.outputs.rc != '0'
        run: |
          if [ "${{ steps.check.outputs.rc }}" = "2" ]; then
            echo "::error::The T2 graphics check could not run - see the log above"
          else
            echo "::error::A T2 EFI build has graphics settings that hang the boot - see the summary"
          fi
          exit 1

  # Outside PRs: keep the result in one tracking issue.
  report:
    needs: check
    if: >-
      always() && needs.check.result != 'skipped' && needs.check.result != 'cancelled' &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.event_name == 'release')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: t2-graphics-result
          path: ${{ runner.temp }}/result

      - name: Update tracking issue
        uses: actions/github-script@v8
        env:
          CHECK_RESULT: ${{ needs.check.result }}
        with:
          script: |
            const fs = require('fs');
            const MARKER = '<!-- t2-graphics-main-report -->';
            const TITLE = 'T2 graphics check: settings that hang T2 Macs at the Apple logo on main';
            const MAX = 150;
            const { owner, repo } = context.repo;
            const dir = `${process.env.RUNNER_TEMP}/result`;
            const sha = context.sha, short = sha.slice(0, 7);
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const isRelease = context.eventName === 'release';
            const tag = isRelease ? context.payload.release.tag_name : null;
            const where = isRelease ? `release \`${tag}\` (${short})` : `\`main\` (at ${short})`;

            if (fs.existsSync(`${dir}/skipped`)) return;

            let result = null;
            try { result = JSON.parse(fs.readFileSync(`${dir}/result.json`, 'utf8')); } catch {}
            const fatal = !result ? `no result was produced (check job: ${process.env.CHECK_RESULT})` : result.fatal;
            const problems = result && Array.isArray(result.new) ? result.new : [];
            const errors = result && Array.isArray(result.errors) ? result.errors : [];

            const esc = s => String(s).replace(/[|`<>\[\]]/g, c => ({ '|': '\\|', '`': "'", '<': '&lt;', '>': '&gt;', '[': '\\[', ']': '\\]' }[c])).replace(/@/g, '@​').slice(0, 500);

            // Only our own issue - anybody can paste the marker into an issue
            const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'all', creator: 'github-actions[bot]', per_page: 100 });
            const ours = issues.filter(i => !i.pull_request && i.body && i.body.includes(MARKER));
            const existing = ours.find(i => i.state === 'open') || ours[0];

            if (!fatal && !problems.length) {
              if (existing && existing.state === 'open') {
                await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body:
                  `✅ ${where}: no T2 build has graphics settings that hang the boot anymore ([run](${runUrl})). Closing.\n\n` +
                  `✅ ${where}: Kein T2-Build enthält mehr Grafik-Einstellungen, die den Start aufhängen. Wird geschlossen.` });
                await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed', state_reason: 'completed' });
              }
              return;
            }

            let body =
              `${MARKER}\n` +
              (isRelease ? `> [!CAUTION]\n> **Release \`${tag}\` is affected.** T2 Macs built with it may hang at the Apple logo unless the T2 Installer Workaround is enabled.\n\n` : '') +
              `Automatic report of the T2 graphics check on ${where}, [run](${runUrl}). ` +
              `Updated on every push to \`main\`, every release and every Monday; closed automatically once everything passes.\n\n` +
              `**Why this matters:** T2 Macs hung at the Apple logo unless the T2 Installer Workaround (software rendering) was enabled, ` +
              `because the EFI forced Apple's GuC firmware (\`igfxfw=2\`) and overrode the Intel framebuffer on Macs whose own firmware values work (fixed in 075e24b).\n\n` +
              `<details><summary>Deutsch</summary>\n\n` +
              `Automatischer Bericht des T2-Grafik-Checks auf ${where}. Wird bei jedem Push auf \`main\`, jedem Release und jeden Montag aktualisiert ` +
              `und automatisch geschlossen, sobald alles besteht.\n\n` +
              `**Warum das wichtig ist:** T2-Macs blieben beim Apple-Logo hängen, außer der T2 Installer Workaround (Software-Rendering) war aktiv, ` +
              `weil das EFI Apples GuC-Firmware erzwang (\`igfxfw=2\`) und den Intel-Framebuffer auf Macs überschrieb, deren eigene Firmware-Werte funktionieren (behoben in 075e24b).\n` +
              (isRelease ? `\n**Release \`${tag}\` ist betroffen.**\n` : '') +
              `</details>\n\n`;

            if (fatal) {
              body += `## ❌ The check could not run\n\n\`${esc(fatal)}\`\n\n` +
                      `Until it runs again, nothing protects against this bug. See the [run log](${runUrl}).\n\n` +
                      `Der Check konnte nicht laufen - bis er wieder läuft, schützt nichts vor diesem Fehler.\n\n`;
            }
            if (problems.length) {
              body += `## ❌ ${problems.length} problem(s)\n\n| Rule | Build | Where | Problem |\n|---|---|---|---|\n` +
                      problems.slice(0, MAX).map(p => `| \`${esc(p.rule)}\` | \`${esc(p.case)}\` | \`${esc(p.subject)}\` | ${esc(p.message)} |`).join('\n') +
                      (problems.length > MAX ? `\n\n…and ${problems.length - MAX} more - see the [run log](${runUrl}).` : '') + `\n\n`;
            }
            if (result && result.cases) {
              body += `<details><summary>Builds</summary>\n\n| Build | Checked | Problems | Couldn't check |\n|---|---|---|---|\n` +
                      Object.entries(result.cases).map(([k, c]) => `| \`${esc(k)}\` | ${+c.checked || 0} | ${+c.problems || 0} | ${+c.errors || 0} |`).join('\n') +
                      `\n</details>\n`;
            }
            if (errors.length) {
              body += `\n<details><summary>${errors.length} build(s) couldn't be checked</summary>\n\n| Build | Model | Error |\n|---|---|---|\n` +
                      errors.slice(0, 50).map(e => `| \`${esc(e.case)}\` | \`${esc(e.subject)}\` | ${esc(e.message)} |`).join('\n') + `\n</details>\n`;
            }
            if (body.length > 65000) body = body.slice(0, 64000) + `\n\n…truncated - see the [run log](${runUrl}).`;

            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, title: TITLE, body, state: 'open' });
              if (existing.state === 'closed' || isRelease) {
                await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body:
                  `⚠️ ${isRelease ? `Release \`${tag}\` is affected` : 'Back on main'} (${short}, [run](${runUrl})) - see the updated description.` });
              }
            } else {
              await github.rest.issues.create({ owner, repo, title: TITLE, body });
            }
