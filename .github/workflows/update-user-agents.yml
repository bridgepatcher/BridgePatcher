name: Update browser user agents

# BridgePatcher sends browser user agents (Safari, Edge) to some download servers.
# A browser version that is months old looks like a bot and can get requests
# blocked, so once a day this checks the latest stable Chrome, Edge and Safari
# versions and, when a user agent in the source is behind, opens a PR from a
# bot/update-user-agents-<hash> branch. The script never downgrades a version.
#
# main is protected by a ruleset that requires status checks, so the bump can't
# be pushed to main directly - it has to go through a PR like any other change.
#
# Pushes and PRs made with the default GITHUB_TOKEN do NOT trigger other workflows,
# so the required checks would never start on the PR. Add a fine-grained PAT or
# GitHub App token as the secret UA_UPDATE_TOKEN (contents + pull requests: write
# on this repo) and the checks run on their own; auto-merge is turned on as well,
# so the PR merges once they pass. Without the secret the PR is still opened, but
# someone has to close and reopen it to start the checks.
#
# Run it by hand from the Actions tab ("Run workflow") to check right away.

on:
  schedule:
    - cron: "41 6 * * *"   # daily, 06:41 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-user-agents
  cancel-in-progress: false

jobs:
  update:
    if: github.repository_owner == 'bridgepatcher'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      BASE: ${{ github.event.repository.default_branch }}
      PREFIX: bot/update-user-agents-
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.UA_UPDATE_TOKEN || github.token }}
      HAS_TOKEN: ${{ secrets.UA_UPDATE_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Bump out-of-date user agents and open a PR
        run: |
          git config core.hooksPath /dev/null
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Use the script from the commit this run started on, main is checked out below
          cp .github/scripts/update_user_agents.py "$RUNNER_TEMP/"

          # Always start from the latest main, so the PR never carries stale bumps
          git fetch -q "$remote" "refs/heads/$BASE"
          git checkout -q -B update-user-agents FETCH_HEAD
          ROOT_DIR="$PWD" python3 "$RUNNER_TEMP/update_user_agents.py" --summary "$RUNNER_TEMP/body.md"
          cat "$RUNNER_TEMP/body.md" >> "$GITHUB_STEP_SUMMARY"

          # Branches are force-push protected, so a branch is never rewritten: each distinct
          # update gets its own branch, named after a hash of its diff. The same update on a
          # later run lands on the same name and reuses the PR that's already open.
          branch=""
          if ! git diff --quiet -- bridgepatcher ci_tooling; then
            branch="$PREFIX$(git diff -- bridgepatcher ci_tooling | sha256sum | cut -c1-12)"
          fi

          # Close bot PRs for any other (outdated) update
          gh pr list --base "$BASE" --state open --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"$PREFIX\")) | \"\(.number) \(.headRefName)\"" |
          while read -r old old_branch; do
            [ "$old_branch" = "$branch" ] && continue
            if [ -n "$branch" ]; then
              msg="Superseded by a newer user agent update. / Durch eine neuere User-Agent-Aktualisierung ersetzt."
            else
              msg="✅ All user agents on \`$BASE\` are up to date. Closing. / Alle User Agents auf \`$BASE\` sind aktuell. Wird geschlossen."
            fi
            gh pr close "$old" --comment "$msg" > /dev/null
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$old_branch" > /dev/null 2>&1 \
              || echo "::warning::Closed #$old but couldn't delete its branch $old_branch - delete it by hand."
            echo "Closed outdated PR #$old."
          done

          if [ -z "$branch" ]; then
            echo "All user agents are up to date."
            exit 0
          fi

          pr=$(gh pr list --head "$branch" --base "$BASE" --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            echo "This update is already proposed in #$pr."
          else
            # The branch may already exist from an earlier run whose PR couldn't be created.
            # Reuse it then - pushing a new commit there would be a force push.
            if git ls-remote --exit-code -q "$remote" "refs/heads/$branch" > /dev/null; then
              echo "Branch $branch already exists, reusing it."
            else
              git add -- bridgepatcher ci_tooling
              git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -q -m "Update browser user agents to the latest stable versions" \
                -m "Generated by the update-user-agents workflow."
              git push -q "$remote" "HEAD:refs/heads/$branch"
              echo "Pushed $(git rev-parse --short HEAD) to $branch."
            fi

            {
              echo "<!-- update-user-agents -->"
              cat "$RUNNER_TEMP/body.md"
              echo
              echo "Opened by the daily update-user-agents run. It's closed automatically when a newer update replaces it or \`$BASE\` is already up to date."
              echo
              echo "<details><summary>Deutsch</summary>"
              echo
              echo "Automatische Aktualisierung der Browser-User-Agents auf die neuesten stabilen Versionen. Der PR wird automatisch geschlossen, wenn eine neuere Aktualisierung ihn ersetzt oder \`$BASE\` schon aktuell ist."
              echo "</details>"
            } > "$RUNNER_TEMP/pr.md"

            # With GITHUB_TOKEN this needs "Allow GitHub Actions to create and approve
            # pull requests" enabled for the organization AND the repository.
            if ! url=$(gh pr create --head "$branch" --base "$BASE" \
                         --title "Update browser user agents" --body-file "$RUNNER_TEMP/pr.md" 2>"$RUNNER_TEMP/pr_err.txt"); then
              cat "$RUNNER_TEMP/pr_err.txt"
              compare="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$BASE...$branch?expand=1"
              echo "::error::Couldn't create the PR (is 'Allow GitHub Actions to create and approve pull requests' enabled in the org and repo settings?). The update is on $branch - open the PR manually: $compare"
              exit 1
            fi
            pr=${url##*/}
            echo "Opened PR #$pr."
          fi

          # Merge on its own once the required checks pass (needs "Allow auto-merge" in the repo settings)
          gh pr merge "$pr" --auto --squash > /dev/null 2>&1 \
            || echo "::warning::Couldn't turn on auto-merge for #$pr (is 'Allow auto-merge' enabled in the repo settings?). Merge it by hand once the checks pass."

          if [ "$HAS_TOKEN" != true ]; then
            echo "::warning::UA_UPDATE_TOKEN isn't set, so the required checks won't start on #$pr by themselves (pushes made with GITHUB_TOKEN don't trigger workflows). Close and reopen the PR to start them, or add the secret."
          fi
