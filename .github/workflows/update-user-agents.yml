name: Update browser user agents

# BridgePatcher sends browser user agents (Safari, Edge) to some download servers.
# A browser version that is months old looks like a bot and can get requests
# blocked, so once a day this checks the latest stable Chrome, Edge and Safari
# versions and, when a user agent in the source is behind, commits the bump
# straight to main. The script never downgrades a version.
#
# Run it by hand from the Actions tab ("Run workflow") to check right away.

on:
  schedule:
    - cron: "41 6 * * *"   # daily, 06:41 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-user-agents
  cancel-in-progress: false

jobs:
  update:
    if: github.repository_owner == 'bridgepatcher'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BASE: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Bump out-of-date user agents and push to main
        run: |
          git config core.hooksPath /dev/null
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Use the script from the commit this run started on, main is checked out below
          cp .github/scripts/update_user_agents.py "$RUNNER_TEMP/"

          # If main moves while this runs, start again from the new main instead of rebasing:
          # the script is idempotent and a rebase could conflict on the same lines.
          for delay in 2 4 8 16 0; do
            git fetch -q "$remote" "refs/heads/$BASE"
            git checkout -q -B "$BASE" FETCH_HEAD
            ROOT_DIR="$PWD" python3 "$RUNNER_TEMP/update_user_agents.py" --summary "$RUNNER_TEMP/body.md"

            if git diff --quiet -- bridgepatcher ci_tooling; then
              echo "All user agents are up to date."
              cat "$RUNNER_TEMP/body.md" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            git add -- bridgepatcher ci_tooling
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Update browser user agents to the latest stable versions" \
              -m "Generated by the update-user-agents workflow."
            if git push -q "$remote" "HEAD:refs/heads/$BASE"; then
              echo "Pushed $(git rev-parse --short HEAD) to $BASE."
              cat "$RUNNER_TEMP/body.md" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            [ "$delay" = 0 ] && break
            echo "Push failed, retrying in ${delay}s from the latest $BASE."
            sleep "$delay"
          done
          echo "::error::Could not push the user agent update to $BASE"
          exit 1
