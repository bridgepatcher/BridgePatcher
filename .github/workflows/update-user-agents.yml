name: Update browser user agents

# BridgePatcher sends browser user agents (Safari, Edge) to some download servers.
# A browser version that is months old looks like a bot and can get requests
# blocked, so once a week this checks the latest stable Chrome, Edge and Safari
# versions and, when a user agent in the source is behind, opens (or updates) a
# pull request that bumps it. The pull request is closed again if main catches
# up on its own. The script never downgrades a version.
#
# Run it by hand from the Actions tab ("Run workflow") to check right away.

on:
  schedule:
    - cron: "41 6 * * 1"   # weekly, Monday 06:41 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-user-agents
  cancel-in-progress: false

jobs:
  update:
    if: github.repository_owner == 'bridgepatcher'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: automation/update-user-agents
      BASE: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Bump out-of-date user agents
        id: ua
        run: |
          python3 .github/scripts/update_user_agents.py --summary "$RUNNER_TEMP/body.md"
          cat "$RUNNER_TEMP/body.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the pull request
        if: steps.ua.outputs.changed == 'true'
        run: |
          git config core.hooksPath /dev/null
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git checkout -q -B "$BRANCH"
          git add -- bridgepatcher ci_tooling
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Update browser user agents to the latest stable versions" \
            -m "Generated by the update-user-agents workflow from ${GITHUB_SHA::7}."

          # Don't push a new commit when the branch already holds exactly this change
          if git fetch -q "$remote" "refs/heads/$BRANCH" 2>/dev/null &&
             [ "$(git rev-parse 'FETCH_HEAD^{tree}')" = "$(git rev-parse 'HEAD^{tree}')" ]; then
            echo "$BRANCH already has these changes."
          else
            git push -q --force "$remote" "HEAD:refs/heads/$BRANCH"
          fi

          pr=$(gh pr list --head "$BRANCH" --base "$BASE" --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/pulls/$pr" -F "body=@$RUNNER_TEMP/body.md" > /dev/null
            echo "Updated pull request #$pr"
          else
            gh pr create --head "$BRANCH" --base "$BASE" \
              --title "Update browser user agents to the latest stable versions" \
              --body-file "$RUNNER_TEMP/body.md"
          fi

      - name: Close the pull request when main is already up to date
        # Only when every version source answered: an unreachable source says nothing about its user agents
        if: steps.ua.outputs.changed == 'false' && steps.ua.outputs.complete == 'true'
        run: |
          pr=$(gh pr list --head "$BRANCH" --base "$BASE" --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr close "$pr" --delete-branch \
              --comment "The user agents on \`$BASE\` are already on the latest stable browser versions, closing."
          else
            echo "All user agents are up to date."
          fi
